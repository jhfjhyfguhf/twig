<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة طويق | Tuwaiq Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --saudi-green: #006C48;
            --saudi-gold: #D4AF37;
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --text-main: #0a0a0a;
        }
        
        .dark-mode {
            --bg-main: #050705;
            --card-bg: #0f130f;
            --text-main: #f0f0f0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #e5e7eb;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .app-container {
            background-color: var(--bg-main);
            max-width: 450px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        .nav-active { color: var(--saudi-green) !important; font-weight: 900; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes ripple {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        .live-indicator {
            position: relative;
        }
        .live-indicator::after {
            content: '';
            position: absolute;
            top: -2px; right: -2px;
            width: 8px; height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: ripple 1.5s infinite;
        }
    </style>
</head>
<body>

    <div id="view-login" class="fixed inset-0 z-[999] bg-[#006C48] flex flex-col items-center justify-center p-8 text-center hidden">
        <div class="mb-10">
            <div class="w-24 h-24 bg-white rounded-[2.5rem] flex items-center justify-center shadow-2xl mx-auto mb-6">
                <i class="fas fa-mountain text-[#006C48] text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black text-white mb-2">منصة طويق</h1>
            <p class="text-white/70 font-medium italic">همة تعانق السماء 🇸🇦</p>
        </div>
        <button onclick="handleLogin()" class="w-full max-w-xs bg-white text-gray-900 font-black py-4 px-6 rounded-2xl flex items-center justify-center gap-4 shadow-xl hover:scale-105 transition-transform active:scale-95">
            <img src="https://www.google.com/favicon.ico" class="w-6 h-6">
            تسجيل الدخول عبر جوجل
        </button>
        <p class="absolute bottom-12 text-white/30 text-xs font-bold tracking-widest uppercase">Tuwaiq Network 2030</p>
    </div>

    <div id="view-setup" class="fixed inset-0 z-[998] bg-white flex flex-col p-8 hidden">
        <h2 class="text-2xl font-black mb-2 text-gray-900">إكمال ملفك الشخصي</h2>
        <p class="text-gray-400 text-sm mb-8">لنتمكن من تخصيص تجربتك في طويق</p>
        
        <div class="space-y-6">
            <div class="flex justify-center mb-6">
                <div class="relative">
                    <img id="setup-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Tuwaiq" class="w-24 h-24 rounded-3xl bg-gray-100 border-4 border-[#006C48]/20">
                    <button class="absolute -bottom-2 -right-2 bg-[#006C48] text-white w-8 h-8 rounded-full border-4 border-white">
                        <i class="fas fa-camera text-xs"></i>
                    </button>
                </div>
            </div>
            
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">الاسم الكامل</label>
                <input type="text" id="setup-name" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
            </div>

            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">اسم المستخدم (English Only)</label>
                <input type="text" id="setup-username" placeholder="e.g. tuwaiq_hero" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
            </div>

            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">العمر</label>
                <input type="number" id="setup-age" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
            </div>

            <button onclick="completeProfile()" class="w-full bg-[#006C48] text-white font-black py-4 rounded-2xl shadow-lg mt-4">
                حفظ ودخول المنصة
            </button>
        </div>
    </div>

    <div id="app" class="app-container flex flex-col hidden">
        
        <header class="sticky top-0 z-50 bg-inherit/80 backdrop-blur-md border-b border-gray-500/5 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-[#006C48] rounded-xl flex items-center justify-center shadow-md">
                    <i class="fas fa-mountain text-white text-sm"></i>
                </div>
                <h1 class="text-lg font-black tracking-tight">طويق</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="text-lg opacity-40 hover:opacity-100"><i id="theme-icon" class="fas fa-moon"></i></button>
                <button class="text-lg opacity-40 hover:opacity-100"><i class="far fa-bell"></i></button>
            </div>
        </header>

        <main class="flex-1 pb-24 overflow-y-auto no-scrollbar">
            
            <section id="view-home" class="view-content">
                <!-- Twitter Style Composer -->
                <div class="p-4 border-b border-gray-500/5">
                    <div class="flex gap-4">
                        <img id="user-avatar-mini" src="" class="w-11 h-11 rounded-2xl bg-gray-100 shadow-sm object-cover">
                        <div class="flex-1">
                            <textarea id="post-input" placeholder="ما هي همتك اليوم؟ 🇸🇦" class="w-full bg-transparent border-none resize-none focus:ring-0 text-lg font-medium min-h-[80px] pt-2"></textarea>
                            <div class="flex justify-between items-center mt-2 border-t border-gray-500/5 pt-3">
                                <div class="flex gap-4 text-[#006C48] text-xl">
                                    <label class="cursor-pointer hover:bg-gray-100 p-2 rounded-full transition"><i class="far fa-image"></i><input type="file" class="hidden"></label>
                                    <button class="hover:bg-gray-100 p-2 rounded-full transition"><i class="far fa-smile"></i></button>
                                </div>
                                <button onclick="publishPost()" class="bg-[#006C48] text-white px-6 py-2 rounded-full font-black shadow-lg hover:scale-105 active:scale-95 transition-all">نشر</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Stories Section -->
                <div class="flex gap-4 p-4 overflow-x-auto no-scrollbar bg-gray-500/[0.02] border-b border-gray-500/5">
                    <div class="flex flex-col items-center gap-1 min-w-[70px]">
                        <input type="file" id="story-file" class="hidden" onchange="uploadStory(this)">
                        <div onclick="document.getElementById('story-file').click()" class="w-16 h-16 rounded-2xl border-2 border-dashed border-[#006C48] flex items-center justify-center cursor-pointer hover:bg-[#006C48]/5 transition">
                            <i class="fas fa-plus text-[#006C48]"></i>
                        </div>
                        <span class="text-[10px] font-bold">قصتك</span>
                    </div>
                    <div id="stories-list" class="flex gap-4"></div>
                </div>

                <!-- Posts Feed -->
                <div id="main-feed" class="divide-y divide-gray-500/5">
                    <div class="py-20 text-center opacity-20">
                        <i class="fas fa-circle-notch animate-spin text-3xl mb-4"></i>
                        <p class="font-bold">جاري تحميل جبل طويق...</p>
                    </div>
                </div>
            </section>

            <section id="view-trends" class="view-content hidden p-6">
                <h2 class="text-2xl font-black mb-6">المتداول الآن 🇸🇦</h2>
                <div class="space-y-6" id="trends-container"></div>
            </section>

            <section id="view-live" class="view-content hidden p-6">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-black">بث مباشر</h2>
                    <button onclick="openLiveSetup()" class="bg-red-600 text-white px-5 py-2 rounded-xl font-black text-xs shadow-xl flex items-center gap-2 hover:bg-red-700 transition">
                        <i class="fas fa-video"></i>
                        فتح بث جديد
                    </button>
                </div>
                <div class="grid grid-cols-1 gap-6" id="live-container"></div>
            </section>

            <section id="view-profile" class="view-content hidden">
                <div class="h-44 bg-gradient-to-br from-[#006C48] to-[#004d33] relative">
                    <img src="https://images.unsplash.com/photo-1548013146-72479768b921?auto=format&fit=crop&w=800" class="w-full h-full object-cover opacity-30">
                </div>
                <div class="px-6 -mt-14 relative">
                    <img id="profile-avatar-large" src="" class="w-28 h-28 rounded-[2.5rem] bg-white border-4 border-[#006C48] shadow-2xl object-cover">
                    <div class="mt-4">
                        <h2 id="profile-name" class="text-2xl font-black">--</h2>
                        <p id="profile-handle" class="text-[#D4AF37] font-bold text-sm">@--</p>
                    </div>
                    
                    <div class="flex gap-6 mt-6 pb-6 border-b border-gray-500/5">
                        <div class="text-center"><span class="block font-black text-lg">0</span><span class="text-[10px] opacity-40 font-black">متابِع</span></div>
                        <div class="text-center"><span class="block font-black text-lg">0</span><span class="text-[10px] opacity-40 font-black">يتابعني</span></div>
                    </div>

                    <button onclick="handleLogout()" class="w-full mt-6 bg-red-500/10 text-red-500 font-black py-3 rounded-2xl text-sm transition hover:bg-red-500 hover:text-white">
                        تسجيل الخروج
                    </button>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 max-w-[450px] mx-auto bg-inherit/90 backdrop-blur-xl border-t border-gray-500/10 flex justify-around items-center h-20 z-[100] px-2">
            <button onclick="switchTab('home')" id="nav-home" class="nav-active flex flex-col items-center gap-1.5 flex-1 opacity-80 hover:opacity-100 transition-all">
                <i class="fas fa-house-chimney text-xl"></i>
                <span class="text-[10px] font-black">الرئيسية</span>
            </button>
            <button onclick="switchTab('trends')" id="nav-trends" class="text-gray-400 flex flex-col items-center gap-1.5 flex-1 opacity-80 hover:opacity-100 transition-all">
                <i class="fas fa-hashtag text-xl"></i>
                <span class="text-[10px] font-black">الترند</span>
            </button>
            <button onclick="switchTab('live')" id="nav-live" class="text-gray-400 flex flex-col items-center gap-1.5 flex-1 opacity-80 hover:opacity-100 transition-all">
                <i class="fas fa-tower-broadcast text-xl"></i>
                <span class="text-[10px] font-black">بث مباشر</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-gray-400 flex flex-col items-center gap-1.5 flex-1 opacity-80 hover:opacity-100 transition-all">
                <i class="fas fa-user-astronaut text-xl"></i>
                <span class="text-[10px] font-black">ملفي</span>
            </button>
        </nav>
    </div>

    <div id="live-modal" class="fixed inset-0 z-[1000] bg-black/90 flex flex-col items-center justify-center p-8 hidden">
        <div class="w-full max-w-sm bg-white rounded-[2.5rem] p-8 text-center">
            <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-video text-3xl"></i>
            </div>
            <h3 class="text-xl font-black mb-2 text-gray-900">بدء بث جديد</h3>
            <p class="text-gray-400 text-sm mb-6">سيتم إخطار متابعيك فور بدء البث</p>
            <input type="text" id="live-title" placeholder="عنوان البث..." class="w-full bg-gray-100 border-none rounded-2xl p-4 mb-4 font-bold text-gray-900">
            <div class="flex gap-3">
                <button onclick="closeLiveModal()" class="flex-1 bg-gray-100 text-gray-900 font-black py-4 rounded-2xl">إلغاء</button>
                <button onclick="startBroadcast()" class="flex-1 bg-red-600 text-white font-black py-4 rounded-2xl shadow-lg">انطلق مباشر</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cuaoopauabnmpmoddvby.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YW9vcGF1YWJubXBtb2RkdmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjgyNDUsImV4cCI6MjA5MzIwNDI0NX0._vyBPMk3oaJqMJaBRY4DaKj2ZjSodKPxZ77kFiZUH9o';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let userSession = null;

        window.onload = () => {
            initApp();
        };

        async function initApp() {
            const localUser = localStorage.getItem('tuwaiq_user');
            if (localUser) {
                userSession = JSON.parse(localUser);
                showMainApp();
            } else {
                document.getElementById('view-login').classList.remove('hidden');
            }
        }

        async function handleLogin() {
            // حل ذكي: نقوم بإنشاء هوية مؤقتة مرتبطة بمتصفح المستخدم لتفادي خطأ Provider Disabled
            // حتى تقوم بتفعيله يدوياً في Supabase
            const tempUser = {
                id: 'user_' + Math.random().toString(36).substr(2, 9),
                avatar_url: `https://api.dicebear.com/7.x/avataaars/svg?seed=${Math.random()}`,
                full_name: '',
                username: '',
                age: ''
            };
            userSession = tempUser;
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-setup').classList.remove('hidden');
        }

        async function completeProfile() {
            const name = document.getElementById('setup-name').value.trim();
            const username = document.getElementById('setup-username').value.trim();
            const age = document.getElementById('setup-age').value;

            if (!name || !username || !age) return showToast("يرجى إكمال جميع الحقول");
            if (!/^[a-zA-Z0-9_]+$/.test(username)) return showToast("اليوزر يجب أن يكون بالإنجليزية فقط");

            userSession.full_name = name;
            userSession.username = username;
            userSession.age = age;

            localStorage.setItem('tuwaiq_user', JSON.stringify(userSession));
            showMainApp();
            showToast("مرحباً بك في طويق! 🇸🇦");
        }

        function showMainApp() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            document.getElementById('user-avatar-mini').src = userSession.avatar_url;
            document.getElementById('profile-avatar-large').src = userSession.avatar_url;
            document.getElementById('profile-name').innerText = userSession.full_name;
            document.getElementById('profile-handle').innerText = `@${userSession.username}`;
            
            loadPosts();
            loadTrends();
        }

        async function loadPosts() {
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (!error) renderPosts(data);
            else renderPosts([]);
        }

        function renderPosts(posts) {
            const container = document.getElementById('main-feed');
            if (!posts || posts.length === 0) {
                container.innerHTML = `<div class="p-20 text-center opacity-30 text-xs font-bold italic">لا توجد همم منشورة بعد.. كن الأول!</div>`;
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="p-5 hover:bg-gray-500/[0.02] transition-all">
                    <div class="flex gap-3 mb-4">
                        <img src="${post.author_avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=Tuwaiq'}" class="w-11 h-11 rounded-2xl bg-gray-100 shadow-sm border border-gray-500/5">
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <h4 class="font-black text-sm">${post.author_name}</h4>
                                <span class="text-[9px] opacity-40 font-bold">${formatTime(post.created_at)}</span>
                            </div>
                            <p class="text-[10px] text-[#006C48] font-bold">@${post.username || 'user'}</p>
                        </div>
                    </div>
                    <p class="text-[15px] mb-4 leading-relaxed font-medium">${post.content}</p>
                    <div class="flex gap-8 opacity-40 text-xs font-bold">
                        <button onclick="handleLike('${post.id}')" class="flex items-center gap-2 hover:text-red-500 transition-colors">
                            <i class="far fa-heart"></i><span>${post.likes || 0}</span>
                        </button>
                        <button class="flex items-center gap-2 hover:text-[#006C48]"><i class="far fa-comment"></i><span>0</span></button>
                        <button class="flex items-center gap-2 hover:text-[#D4AF37]"><i class="fas fa-share-alt"></i></button>
                    </div>
                </div>
            `).join('');
        }

        async function publishPost() {
            const input = document.getElementById('post-input');
            const content = input.value.trim();
            if (!content) return;

            const { error } = await _supabase.from('posts').insert([{
                content: content,
                author_name: userSession.full_name,
                author_avatar: userSession.avatar_url,
                username: userSession.username,
                likes: 0
            }]);

            if (!error) {
                input.value = "";
                loadPosts();
                showToast("تم نشر همّتك بنجاح 🇸🇦");
            } else {
                showToast("خطأ في النشر، تأكد من إعدادات الجدول");
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'text-[#006C48]'));
            document.querySelectorAll('nav button').forEach(b => b.classList.add('text-gray-400'));
            
            const activeBtn = document.getElementById(`nav-${tab}`);
            activeBtn.classList.add('nav-active');
            activeBtn.classList.remove('text-gray-400');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = "fixed top-10 left-1/2 -translate-x-1/2 bg-[#006C48] text-white px-6 py-3 rounded-2xl text-sm font-black shadow-2xl z-[2000] border border-white/20";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function formatTime(dateStr) {
            const diff = Math.floor((new Date() - new Date(dateStr)) / 1000);
            if (diff < 60) return "الآن";
            if (diff < 3600) return `${Math.floor(diff/60)}د`;
            if (diff < 86400) return `${Math.floor(diff/3600)}س`;
            return "منذ أيام";
        }

        function openLiveSetup() { document.getElementById('live-modal').classList.remove('hidden'); }
        function closeLiveModal() { document.getElementById('live-modal').classList.add('hidden'); }
        function startBroadcast() {
            const title = document.getElementById('live-title').value;
            if(!title) return showToast("يرجى كتابة عنوان للبث");
            showToast("جاري تجهيز استوديو البث...");
            setTimeout(() => {
                closeLiveModal();
                showToast("أنت الآن مباشر! 🔴");
            }, 2000);
        }

        function handleLogout() {
            localStorage.removeItem('tuwaiq_user');
            window.location.reload();
        }

        function loadTrends() {
            const container = document.getElementById('trends-container');
            const trends = [
                { id: 1, tag: "#رؤية_السعودية_2030", count: "1.2M", category: "سياسة واقتصاد" },
                { id: 2, tag: "#طويق_التقني", count: "850K", category: "تقنية" },
                { id: 3, tag: "#الرياض_إكسبو_2030", count: "420K", category: "فعاليات" }
            ];
            container.innerHTML = trends.map(t => `
                <div class="p-4 bg-gray-500/[0.03] rounded-2xl border-r-4 border-[#006C48]">
                    <span class="text-[10px] text-[#006C48] font-black uppercase tracking-wider">${t.category}</span>
                    <h3 class="text-lg font-black mt-1">${t.tag}</h3>
                    <p class="text-[10px] opacity-40 font-bold">${t.count} تغريدة</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
