<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة طويق | Tuwaiq Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --saudi-green: #006C48;
            --saudi-gold: #D4AF37;
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --text-main: #0a0a0a;
        }
        
        .dark-mode {
            --bg-main: #050705;
            --card-bg: #0f130f;
            --text-main: #f0f0f0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #e5e7eb;
            color: var(--text-main);
            transition: all 0.3s ease;
            margin: 0; padding: 0; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            background-color: var(--bg-main);
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.2);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-active { color: var(--saudi-green) !important; font-weight: 900; }
        
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: inherit;
        }

        .scroll-spacer { padding-bottom: 120px; }

        .live-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 40%, transparent 60%, rgba(0,0,0,0.5) 100%);
        }

        #live-video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .heart-animation {
            position: absolute;
            bottom: 100px;
            right: 20px;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
            100% { transform: translateY(-400px) scale(1.5) rotate(20deg); opacity: 0; }
        }

        .lion-animation {
            animation: lion-entrance 3.5s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards;
            filter: drop-shadow(0 0 30px rgba(212, 175, 55, 1));
        }

        @keyframes lion-entrance {
            0% { transform: scale(0) translateY(100px) rotate(-10deg); opacity: 0; }
            30% { transform: scale(1.2) translateY(-20px) rotate(0deg); opacity: 1; }
            50% { transform: scale(1); }
            80% { transform: scale(1.1) translateY(-50px); opacity: 1; }
            100% { transform: scale(2.5) translateY(-300px); opacity: 0; }
        }

        .shake { animation: screen-shake 0.5s infinite; }
        @keyframes screen-shake {
            0% { transform: translate(2px, 2px); }
            25% { transform: translate(-3px, -2px); }
            50% { transform: translate(3px, 1px); }
            100% { transform: translate(0,0); }
        }

        .gold-particle {
            position: absolute;
            background: linear-gradient(45deg, #D4AF37, #FFF5B7);
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 5000;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>

                    </div>

        <!-- Navigation Bar -->
        <nav class="shrink-0 bg-inherit/90 backdrop-blur-xl border-t border-gray-500/10 flex justify-around items-center h-20 z-[100] px-2">

                <i class="fas fa-house-chimney text-xl"></i>

    <script>
        const SUPABASE_URL = 'https://cuaoopauabnmpmoddvby.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YW9vcGF1YWJubXBtb2RkdmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjgyNDUsImV4cCI6MjA5MzIwNDI0NX0._vyBPMk3oaJqMJaBRY4DaKj2ZjSodKPxZ77kFiZUH9o';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let userSession = null;
        let allPosts = [];
        let videoStream = null;
        let chatInterval = null;
        let viewers = 0;

        window.onload = () => {
            const saved = localStorage.getItem('tuwaiq_user');
            if (saved) {
                userSession = JSON.parse(saved);
                showApp();
            }
        }

        function handleLogin() {
            showToast("جاري الربط مع حساب جوجل...");
            setTimeout(() => {
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-setup').classList.remove('hidden');
            }, 1000);
        }

        function completeProfile() {
            const name = document.getElementById('setup-name').value.trim();
            const username = document.getElementById('setup-username').value.trim();
            if (!name || !username) return showToast("فضلاً أكمل بياناتك");
            
            userSession = {
                id: 'tuwaiq_' + Math.random().toString(36).substr(2, 5),
                full_name: name,
                username: username,
                avatar_url: `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`
            };
            localStorage.setItem('tuwaiq_user', JSON.stringify(userSession));
            showApp();
        }

        function showApp() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('user-avatar-mini').src = userSession.avatar_url;
            document.getElementById('profile-avatar-large').src = userSession.avatar_url;
            document.getElementById('profile-name').innerText = userSession.full_name;
            document.getElementById('profile-handle').innerText = '@' + userSession.username;
            loadPosts();
            setupRealtime();
        }

        async function startLiveStream() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: true 
                });
                const videoElement = document.getElementById('live-video-element');
                videoElement.srcObject = videoStream;
                
                document.getElementById('live-lobby').classList.add('hidden');
                document.getElementById('broadcasting-ui').classList.remove('hidden');
                document.getElementById('app-header').classList.add('hidden'); 
                
                startSimulatedChat();
                showToast("أنت الآن مباشر! 🦁🇸🇦");
            } catch (err) {
                console.error(err);
                showToast("خطأ: لم نتمكن من الوصول للكاميرا");
            }
        }

        function endLiveStream() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('live-lobby').classList.remove('hidden');
            document.getElementById('broadcasting-ui').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            clearInterval(chatInterval);
            viewers = 0;
            document.getElementById('live-chat-messages').innerHTML = '';
        }

        function startSimulatedChat() {
            const msgs = ["منور يا بطل!", "همة عالية 🇸🇦", "ما شاء الله تبارك الله", "كفوووو", "تحية من الرياض!", "أطلق بث لليوم", "🔥🔥🔥", "أسد طويق!", "كيف سجلت في الدورة؟"];
            const names = ["سارة", "خالد", "محمد", "نورة", "عبدالعزيز", "فهد", "ريم", "عمر"];
            
            chatInterval = setInterval(() => {
                viewers += Math.floor(Math.random() * 8);
                document.getElementById('live-viewer-count').innerText = viewers.toLocaleString();
                
                if(Math.random() > 0.5) {
                    const chatBox = document.getElementById('live-chat-messages');
                    const msgDiv = document.createElement('div');
                    msgDiv.className = "text-white text-xs bg-black/40 p-2.5 rounded-xl backdrop-blur-sm border border-white/5 animate-fade-in inline-block max-w-[80%]";
                    msgDiv.innerHTML = `<span class="font-black text-[#D4AF37] block mb-0.5">${names[Math.floor(Math.random() * names.length)]}</span> ${msgs[Math.floor(Math.random() * msgs.length)]}`;
                    chatBox.appendChild(msgDiv);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
                
                if(Math.random() > 0.8) spawnHeart();
            }, 1200);
        }

        function sendLiveChatMessage() {
            const input = document.getElementById('live-msg-input');
            if (!input.value.trim()) return;
            const chatBox = document.getElementById('live-chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = "text-white text-xs bg-[#006C48]/60 p-2.5 rounded-xl backdrop-blur-sm border border-white/10 animate-fade-in self-end";
            msgDiv.innerHTML = `<span class="font-black text-white block mb-0.5">أنت (أنا)</span> ${input.value}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            input.value = "";
        }

        function spawnHeart() {
            const container = document.getElementById('view-live');
            const heart = document.createElement('div');
            const colors = ['text-red-500', 'text-[#D4AF37]', 'text-pink-500', 'text-white'];
            heart.className = `heart-animation ${colors[Math.floor(Math.random()*colors.length)]} text-2xl`;
            heart.innerHTML = '<i class="fas fa-heart"></i>';
            heart.style.right = (20 + Math.random() * 40) + 'px';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
        }

        async function loadPosts() {
            const { data } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
            if (data) {
                allPosts = data.filter(p => !p.content.startsWith("SIGNAL_"));
                renderPosts(allPosts);
            }
        }

        function setupRealtime() {
            _supabase.channel('public:posts')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, payload => {
                    if (payload.new.content.includes("SIGNAL_LION_GIFT")) {
                        triggerLionGift(payload.new.content.split(':')[1]);
                    } else {
                        allPosts.unshift(payload.new);
                        renderPosts(allPosts);
                    }
                }).subscribe();
        }

        async function publishPost() {
            const input = document.getElementById('post-input');
            const content = input.value.trim();
            if (!content) return;
            const { error } = await _supabase.from('posts').insert([{
                content: content, author_name: userSession.full_name, author_avatar: userSession.avatar_url,
                username: userSession.username, likes: 0
            }]);
            if (!error) { input.value = ""; showToast("تم النشر بنجاح! 🇸🇦"); loadPosts(); }
        }

        function renderPosts(posts) {
            document.getElementById('main-feed').innerHTML = posts.map(post => `
                <div class="p-5 bg-inherit border-b border-gray-500/5 hover:bg-gray-50 transition">
                    <div class="flex gap-3 mb-3">
                        <img src="${post.author_avatar}" class="w-11 h-11 rounded-2xl bg-gray-100 object-cover shadow-sm">
                        <div class="flex-1">
                            <h4 class="font-black text-sm">${post.author_name}</h4>
                            <p class="text-[10px] text-[#006C48] font-bold">@${post.username}</p>
                        </div>
                    </div>
                    <p class="text-[15px] mb-4 leading-relaxed font-medium">${post.content}</p>
                    <div class="flex gap-8 text-gray-400">
                        <button class="flex items-center gap-2 hover:text-red-500 transition"><i class="far fa-heart"></i><span class="text-xs font-black">${post.likes || 0}</span></button>
                        <button onclick="sendLionGift('${userSession.full_name}')" class="flex items-center gap-2 text-[#D4AF37] hover:scale-105 transition"><i class="fas fa-crown"></i><span class="text-xs font-black">أرسل أسد</span></button>
                    </div>
                </div>
            `).join('');
        }

        async function sendLionGift(sender) {
            showToast("جاري إطلاق أسد طويق... 🦁");
            await _supabase.from('posts').insert([{ content: `SIGNAL_LION_GIFT:${sender}`, author_name: "SYSTEM", username: "system" }]);
        }

        function triggerLionGift(sender) {
            const overlay = document.getElementById('gift-overlay');
            const app = document.getElementById('app');
            document.getElementById('sender-name-label').innerText = `من: ${sender}`;
            overlay.classList.remove('hidden');
            app.classList.add('shake');
            
            // Particles
            for(let i=0; i<80; i++) {
                const p = document.createElement('div');
                p.className = 'gold-particle';
                const size = Math.random() * 15 + 5;
                p.style.width = size + 'px'; p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + 'vw'; p.style.top = '-20px';
                p.style.animationDuration = (Math.random() * 2.5 + 1) + 's';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 3500);
            }
            
            setTimeout(() => { 
                overlay.classList.add('hidden'); 
                app.classList.remove('shake'); 
            }, 4000);
        }

        function switchTab(tab) {
            if (tab !== 'live') endLiveStream();
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'text-gray-400'));
            document.getElementById(`nav-${tab}`).classList.add('nav-active');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-icon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        function handleLogout() { localStorage.removeItem('tuwaiq_user'); location.reload(); }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = "fixed bottom-24 left-1/2 -translate-x-1/2 bg-[#006C48] text-white px-6 py-4 rounded-2xl text-xs font-black shadow-2xl z-[6000] transition-all transform scale-110";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'scale(0.8) translateX(-50%)'; setTimeout(() => t.remove(), 500); }, 2500);
        }
    </script>
</body>
</html>
