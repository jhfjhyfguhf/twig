<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة طويق | Tuwaiq Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --saudi-green: #006C48;
            --saudi-gold: #D4AF37;
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --text-main: #0a0a0a;
        }
        
        .dark-mode {
            --bg-main: #050705;
            --card-bg: #0f130f;
            --text-main: #f0f0f0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #e5e7eb;
            color: var(--text-main);
            transition: all 0.3s ease;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .app-container {
            background-color: var(--bg-main);
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-active { color: var(--saudi-green) !important; font-weight: 900; }
        
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: inherit;
        }

        .scroll-spacer { padding-bottom: 120px; }

        .search-bar-container {
            position: sticky;
            top: 0;
            z-index: 40;
            background: inherit;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .search-input {
            width: 100%;
            background-color: rgba(128, 128, 128, 0.1);
            border: none;
            border-radius: 99px;
            padding: 10px 45px 10px 15px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            background-color: transparent;
            box-shadow: 0 0 0 2px var(--saudi-green);
        }

        .search-icon {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
        }

        .liked { color: #ef4444 !important; }
        .retweeted { color: #10b981 !important; }
    </style>
</head>
<body>

    <div id="view-login" class="fixed inset-0 z-[999] bg-[#006C48] flex flex-col items-center justify-center p-8 text-center">
        <div class="mb-10 text-white">
            <div class="w-24 h-24 bg-white rounded-[2.5rem] flex items-center justify-center shadow-2xl mx-auto mb-6">
                <i class="fas fa-mountain text-[#006C48] text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black mb-2">منصة طويق</h1>
            <p class="text-white/70 font-medium italic">همة تعانق السماء 🇸🇦</p>
        </div>
        <button onclick="handleLogin()" class="w-full max-w-xs bg-white text-gray-900 font-black py-4 px-6 rounded-2xl flex items-center justify-center gap-4 shadow-xl hover:scale-105 transition-transform active:scale-95">
            <img src="https://www.google.com/favicon.ico" class="w-6 h-6">
            تسجيل الدخول عبر جوجل
        </button>
    </div>

    <div id="view-setup" class="fixed inset-0 z-[998] bg-white flex flex-col p-8 hidden overflow-y-auto text-gray-900">
        <h2 class="text-2xl font-black mb-2">إكمال ملفك الشخصي</h2>
        <p class="text-gray-400 text-sm mb-8">لنتمكن من تخصيص تجربتك في طويق</p>
        <div class="space-y-6">
            <div class="flex justify-center mb-6">
                <div class="relative">
                    <img id="setup-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Tuwaiq" class="w-24 h-24 rounded-3xl bg-gray-100 border-4 border-[#006C48]/20 object-cover">
                </div>
            </div>
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">الاسم الكامل</label>
                <input type="text" id="setup-name" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
            </div>
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">اسم المستخدم (English Only)</label>
                <div class="relative">
                    <input type="text" id="setup-username" placeholder="e.g. tuwaiq_hero" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
                    <span id="username-status" class="absolute left-4 top-1/2 -translate-y-1/2 text-[10px]"></span>
                </div>
            </div>
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">العمر</label>
                <input type="number" id="setup-age" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
            </div>
            <button onclick="completeProfile()" id="btn-save-profile" class="w-full bg-[#006C48] text-white font-black py-4 rounded-2xl shadow-lg mt-4 disabled:opacity-50">حفظ ودخول المنصة</button>
        </div>
    </div>

    <div id="app" class="app-container hidden">
        <header class="shrink-0 bg-inherit/80 backdrop-blur-md border-b border-gray-500/5 px-6 py-4 flex justify-between items-center z-50">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-[#006C48] rounded-xl flex items-center justify-center shadow-md">
                    <i class="fas fa-mountain text-white text-sm"></i>
                </div>
                <h1 class="text-lg font-black tracking-tight">طويق</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="text-lg opacity-40 hover:opacity-100"><i id="theme-icon" class="fas fa-moon"></i></button>
                <button class="text-lg opacity-40 hover:opacity-100"><i class="far fa-bell"></i></button>
            </div>
        </header>

        <main class="no-scrollbar">
            <section id="view-home" class="view-content">
                <div class="search-bar-container">
                    <div class="relative">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="main-search" placeholder="ابحث عن تغريدة، شخص، أو همة..." class="search-input" oninput="handleSearch(this.value)">
                    </div>
                </div>

                <div class="p-4 border-b border-gray-500/5 bg-inherit">
                    <div class="flex gap-4">
                        <img id="user-avatar-mini" src="" class="w-11 h-11 rounded-2xl bg-gray-100 shadow-sm object-cover cursor-pointer" onclick="switchTab('profile')">
                        <div class="flex-1">
                            <textarea id="post-input" placeholder="ما هي همتك اليوم؟ 🇸🇦" class="w-full bg-transparent border-none resize-none focus:ring-0 text-lg font-medium min-h-[60px] pt-2" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                            <div class="flex justify-between items-center mt-2 border-t border-gray-500/5 pt-3">
                                <div class="flex gap-4 text-[#006C48] text-xl">
                                    <label class="cursor-pointer hover:bg-gray-100 p-2 rounded-full transition">
                                        <i class="far fa-image"></i>
                                        <input type="file" id="post-image-upload" class="hidden" accept="image/*">
                                    </label>
                                    <button class="hover:bg-gray-100 p-2 rounded-full transition"><i class="far fa-smile"></i></button>
                                </div>
                                <button onclick="publishPost()" class="bg-[#006C48] text-white px-8 py-2 rounded-full font-black shadow-lg hover:brightness-110 active:scale-95 transition-all">نشر</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex gap-4 p-4 overflow-x-auto no-scrollbar bg-gray-500/[0.02] border-b border-gray-500/5 shrink-0">
                    <div class="flex flex-col items-center gap-1 min-w-[70px]">
                        <input type="file" id="story-file" class="hidden" accept="image/*" onchange="uploadStory(this)">
                        <div onclick="document.getElementById('story-file').click()" class="w-16 h-16 rounded-2xl border-2 border-dashed border-[#006C48] flex items-center justify-center cursor-pointer hover:bg-[#006C48]/5 transition">
                            <i class="fas fa-plus text-[#006C48]"></i>
                        </div>
                        <span class="text-[10px] font-bold">قصتك</span>
                    </div>
                    <div id="stories-list" class="flex gap-4"></div>
                </div>

                <div id="main-feed" class="divide-y divide-gray-500/5 scroll-spacer"></div>
            </section>

            <section id="view-profile" class="view-content hidden scroll-spacer">
                <div class="h-44 bg-gradient-to-br from-[#006C48] to-[#004d33] relative">
                    <button id="back-to-feed" class="absolute top-4 right-4 z-10 w-10 h-10 bg-black/20 text-white rounded-full hidden" onclick="closeUserProfile()"><i class="fas fa-arrow-right"></i></button>
                    <img src="https://images.unsplash.com/photo-1548013146-72479768b921?auto=format&fit=crop&w=800" class="w-full h-full object-cover opacity-30">
                </div>
                <div class="px-6 -mt-14 relative">
                    <img id="profile-avatar-large" src="" class="w-28 h-28 rounded-[2.5rem] bg-white border-4 border-[#006C48] shadow-2xl object-cover">
                    <div class="mt-4">
                        <div class="flex items-center gap-2">
                            <h2 id="profile-name" class="text-2xl font-black">--</h2>
                            <i class="fas fa-check-circle text-blue-500 text-sm"></i>
                        </div>
                        <p id="profile-handle" class="text-[#D4AF37] font-bold text-sm">@--</p>
                    </div>
                    <div class="flex gap-6 mt-6 pb-6 border-b border-gray-500/5">
                        <div class="text-center"><span id="count-followers" class="block font-black text-lg">850</span><span class="text-[10px] opacity-40 font-black">متابِع</span></div>
                        <div class="text-center"><span id="count-following" class="block font-black text-lg">1.2K</span><span class="text-[10px] opacity-40 font-black">يتابعني</span></div>
                    </div>
                    <div id="profile-actions-box" class="mt-4 flex gap-2">
                        <button id="logout-btn" onclick="handleLogout()" class="flex-1 bg-red-500/10 text-red-500 font-black py-3 rounded-2xl text-sm transition-all hover:bg-red-500 hover:text-white">تسجيل الخروج</button>
                    </div>
                </div>
                <div id="user-posts-feed" class="mt-6 divide-y divide-gray-500/5"></div>
            </section>

            <section id="view-trends" class="view-content hidden p-6 scroll-spacer">
                <h2 class="text-2xl font-black mb-6">المتداول الآن 🇸🇦</h2>
                <div class="space-y-6" id="trends-container"></div>
            </section>

            <section id="view-live" class="view-content hidden p-6 scroll-spacer">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-black">بث مباشر</h2>
                    <button onclick="showToast('سيتم التفعيل قريباً!')" class="bg-red-600 text-white px-5 py-2 rounded-xl font-black text-xs shadow-xl flex items-center gap-2">
                        <i class="fas fa-video"></i> فتح بث جديد
                    </button>
                </div>
                <div id="live-container" class="grid grid-cols-1 gap-6"></div>
            </section>
        </main>

        <nav class="shrink-0 bg-inherit/90 backdrop-blur-xl border-t border-gray-500/10 flex justify-around items-center h-20 z-[100] px-2">
            <button onclick="switchTab('home')" id="nav-home" class="nav-active flex flex-col items-center gap-1.5 flex-1 transition-all">
                <i class="fas fa-house-chimney text-xl"></i>
                <span class="text-[9px] font-black">الرئيسية</span>
            </button>
            <button onclick="switchTab('trends')" id="nav-trends" class="text-gray-400 flex flex-col items-center gap-1.5 flex-1 transition-all">
                <i class="fas fa-hashtag text-xl"></i>
                <span class="text-[9px] font-black">الترند</span>
            </button>
            <button onclick="switchTab('live')" id="nav-live" class="text-gray-400 flex flex-col items-center gap-1.5 flex-1 transition-all">
                <i class="fas fa-tower-broadcast text-xl"></i>
                <span class="text-[9px] font-black">بث مباشر</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-gray-400 flex flex-col items-center gap-1.5 flex-1 transition-all">
                <i class="fas fa-user-astronaut text-xl"></i>
                <span class="text-[9px] font-black">ملفي</span>
            </button>
        </nav>
    </div>

    <script>
        const SUPABASE_URL = 'https://cuaoopauabnmpmoddvby.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YW9vcGF1YWJubXBtb2RkdmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjgyNDUsImV4cCI6MjA5MzIwNDI0NX0._vyBPMk3oaJqMJaBRY4DaKj2ZjSodKPxZ77kFiZUH9o';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let userSession = null;
        let allPosts = []; 
        let currentViewingProfile = null;

        window.onload = () => initApp();

        async function initApp() {
            const localUser = localStorage.getItem('tuwaiq_user');
            if (localUser) {
                userSession = JSON.parse(localUser);
                showMainApp();
            } else {
                document.getElementById('view-login').classList.remove('hidden');
            }
        }

        async function handleLogin() {
            const tempUser = {
                id: 'user_' + Math.random().toString(36).substr(2, 9),
                avatar_url: `https://api.dicebear.com/7.x/avataaars/svg?seed=${Math.random()}`,
                full_name: '',
                username: '',
                age: ''
            };
            userSession = tempUser;
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-setup').classList.remove('hidden');
        }

        async function completeProfile() {
            const name = document.getElementById('setup-name').value.trim();
            const username = document.getElementById('setup-username').value.trim().toLowerCase();
            const age = document.getElementById('setup-age').value;

            if (!name || !username || !age) return showToast("يرجى إكمال جميع الحقول");
            if (!/^[a-z0-9_]+$/.test(username)) return showToast("اليوزر يجب أن يكون إنجليزي، حروف صغيرة وأرقام فقط");

            // فحص التوافر في قاعدة البيانات
            const { data, error } = await _supabase
                .from('posts')
                .select('username')
                .eq('username', username)
                .limit(1);

            if (data && data.length > 0) {
                return showToast("عذراً، هذا اليوزر محجوز مسبقاً ❌");
            }

            userSession.full_name = name;
            userSession.username = username;
            userSession.age = age;

            localStorage.setItem('tuwaiq_user', JSON.stringify(userSession));
            showMainApp();
            showToast("مرحباً بك في طويق! 🇸🇦");
        }

        function showMainApp() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            document.getElementById('user-avatar-mini').src = userSession.avatar_url;
            updateProfileView(userSession);
            
            loadPosts();
            loadTrends();
            loadLiveStreams();
        }

        async function loadPosts() {
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (!error) {
                allPosts = data;
                renderPosts(data, 'main-feed');
            }
        }

        function renderPosts(posts, containerId) {
            const container = document.getElementById(containerId);
            if (!posts || posts.length === 0) {
                container.innerHTML = `<div class="p-20 text-center opacity-30 text-xs font-bold italic">لا توجد همم حالياً..</div>`;
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="p-5 hover:bg-gray-500/[0.02] transition-all border-b border-gray-500/5 group">
                    <div class="flex gap-3 mb-4">
                        <div class="relative">
                            <img onclick="viewUserProfile('${post.username}')" src="${post.author_avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=Tuwaiq'}" class="w-11 h-11 rounded-2xl bg-gray-100 shadow-sm border border-gray-500/5 object-cover cursor-pointer hover:scale-105 transition">
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <h4 class="font-black text-sm cursor-pointer flex items-center gap-1.5" onclick="viewUserProfile('${post.username}')">
                                    ${post.author_name}
                                    <i class="fas fa-check-circle text-blue-500 text-[10px]"></i>
                                </h4>
                                <span class="text-[9px] opacity-40 font-bold">${formatTime(post.created_at)}</span>
                            </div>
                            <p class="text-[10px] text-[#006C48] font-bold">@${post.username || 'user'}</p>
                        </div>
                    </div>
                    <p class="text-[15px] mb-4 leading-relaxed font-medium">${post.content}</p>
                    <div class="flex gap-8 opacity-40 text-xs font-bold">
                        <button onclick="handleLike('${post.id}')" class="flex items-center gap-2 hover:text-red-500 transition-colors group">
                            <i class="far fa-heart group-active:scale-125 transition"></i><span>${post.likes || 0}</span>
                        </button>
                        <button onclick="handleRetweet('${post.id}')" class="flex items-center gap-2 hover:text-[#006C48] transition-colors">
                            <i class="fas fa-retweet"></i><span>إعادة نشر</span>
                        </button>
                        <button onclick="showToast('سيتم إضافة التعليقات قريباً')" class="flex items-center gap-2 hover:text-[#006C48]"><i class="far fa-comment"></i><span>0</span></button>
                    </div>
                </div>
            `).join('');
        }

        async function publishPost() {
            const input = document.getElementById('post-input');
            const content = input.value.trim();
            if (!content) return;

            const { error } = await _supabase.from('posts').insert([{
                content: content,
                author_name: userSession.full_name,
                author_avatar: userSession.avatar_url,
                username: userSession.username,
                likes: 0
            }]);

            if (!error) {
                input.value = "";
                input.style.height = "auto";
                loadPosts();
                showToast("تم نشر همّتك بنجاح 🇸🇦");
            }
        }

        async function handleLike(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            const { error } = await _supabase
                .from('posts')
                .update({ likes: (post.likes || 0) + 1 })
                .eq('id', postId);

            if (!error) {
                loadPosts();
                showToast("تم الإعجاب بالهمّة ❤️");
            }
        }

        async function handleRetweet(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            const { error } = await _supabase.from('posts').insert([{
                content: `إعادة نشر من @${post.username}: ${post.content}`,
                author_name: userSession.full_name,
                author_avatar: userSession.avatar_url,
                username: userSession.username,
                likes: 0
            }]);

            if (!error) {
                loadPosts();
                showToast("تمت إعادة النشر بنجاح 🔁");
            }
        }

        function viewUserProfile(username) {
            const post = allPosts.find(p => p.username === username);
            const userToView = post ? {
                full_name: post.author_name,
                username: post.username,
                avatar_url: post.author_avatar
            } : null;

            if (userToView) {
                updateProfileView(userToView);
                const userPosts = allPosts.filter(p => p.username === username);
                renderPosts(userPosts, 'user-posts-feed');
                
                if (username !== userSession.username) {
                    document.getElementById('back-to-feed').classList.remove('hidden');
                    document.getElementById('logout-btn').classList.add('hidden');
                } else {
                    document.getElementById('back-to-feed').classList.add('hidden');
                    document.getElementById('logout-btn').classList.remove('hidden');
                }
                
                switchTab('profile');
            }
        }

        function updateProfileView(user) {
            document.getElementById('profile-avatar-large').src = user.avatar_url;
            document.getElementById('profile-name').innerText = user.full_name;
            document.getElementById('profile-handle').innerText = `@${user.username}`;
            document.getElementById('count-followers').innerText = Math.floor(Math.random() * 2000) + 100;
            document.getElementById('count-following').innerText = Math.floor(Math.random() * 1000) + 50;
        }

        function closeUserProfile() {
            document.getElementById('back-to-feed').classList.add('hidden');
            updateProfileView(userSession);
            switchTab('home');
        }

        function switchTab(tab) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            const targetNav = document.getElementById(`nav-${tab}`);
            if (targetNav) targetNav.classList.add('nav-active');
            
            if (tab === 'profile' && document.getElementById('back-to-feed').classList.contains('hidden')) {
                viewUserProfile(userSession.username);
            }
            document.querySelector('main').scrollTop = 0;
        }

        function handleSearch(query) {
            const q = query.toLowerCase().trim();
            if (!q) { renderPosts(allPosts, 'main-feed'); return; }
            const filtered = allPosts.filter(post => 
                (post.content && post.content.toLowerCase().includes(q)) || 
                (post.author_name && post.author_name.toLowerCase().includes(q)) ||
                (post.username && post.username.toLowerCase().includes(q))
            );
            renderPosts(filtered, 'main-feed');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = "fixed top-10 left-1/2 -translate-x-1/2 bg-[#006C48] text-white px-6 py-3 rounded-2xl text-sm font-black shadow-2xl z-[2000] animate-bounce";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transition = 'opacity 0.5s';
                setTimeout(() => t.remove(), 500);
            }, 2500);
        }

        function formatTime(dateStr) {
            const diff = Math.floor((new Date() - new Date(dateStr)) / 1000);
            if (diff < 60) return "الآن";
            if (diff < 3600) return `${Math.floor(diff/60)}د`;
            if (diff < 86400) return `${Math.floor(diff/3600)}س`;
            return "يوم";
        }

        function handleLogout() {
            localStorage.removeItem('tuwaiq_user');
            window.location.reload();
        }

        function uploadStory(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const storyList = document.getElementById('stories-list');
                    const div = document.createElement('div');
                    div.className = "flex flex-col items-center gap-1 min-w-[70px] animate-fade-in";
                    div.innerHTML = `
                        <div class="w-16 h-16 rounded-2xl border-2 border-[#D4AF37] p-0.5 shadow-sm transform hover:scale-105 transition">
                            <img src="${e.target.result}" class="w-full h-full rounded-2xl object-cover">
                        </div>
                        <span class="text-[9px] font-bold opacity-60">الآن</span>
                    `;
                    storyList.prepend(div);
                    showToast("تم رفع قصتك بنجاح ✨");
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function loadTrends() {
            const trends = [
                { id: 1, tag: "#رؤية_السعودية_2030", count: "1.2M", category: "سياسة" },
                { id: 2, tag: "#طويق_التقني", count: "850K", category: "تقنية" },
                { id: 3, tag: "#نيوم", count: "500K", category: "مشاريع" },
                { id: 5, tag: "#يوم_التأسيس", count: "2.5M", category: "وطني" }
            ];
            document.getElementById('trends-container').innerHTML = trends.map(t => `
                <div class="p-4 bg-gray-500/[0.03] rounded-2xl border-r-4 border-[#006C48] hover:bg-gray-500/[0.06] transition cursor-pointer">
                    <span class="text-[10px] text-[#006C48] font-black uppercase tracking-wider">${t.category}</span>
                    <h3 class="text-lg font-black mt-1">${t.tag}</h3>
                    <p class="text-[10px] opacity-40 font-bold">${t.count} تغريدة</p>
                </div>
            `).join('');
        }

        function loadLiveStreams() {
            const streams = [
                { id: 1, title: "دورة الذكاء الاصطناعي", user: "م. سارة", viewers: "2.4K", img: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4" },
                { id: 2, title: "الرياض في الليل 🌃", user: "سعود", viewers: "1.1K", img: "https://images.unsplash.com/photo-1548013146-72479768b921" }
            ];
            document.getElementById('live-container').innerHTML = streams.map(s => `
                <div class="relative h-48 rounded-3xl overflow-hidden shadow-lg group cursor-pointer">
                    <img src="${s.img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                    <div class="absolute top-3 left-3 bg-red-600 text-white text-[9px] font-black px-3 py-1 rounded-full flex items-center gap-1.5 shadow-xl">
                        <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span> مباشر
                    </div>
                    <div class="absolute bottom-3 right-3 left-3">
                        <h4 class="text-white font-black text-sm">${s.title}</h4>
                        <p class="text-white/60 text-[10px]">${s.user} • ${s.viewers} مشاهد</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
