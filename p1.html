<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة طويق | Tuwaiq Platform Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --saudi-green: #006C48;
            --saudi-gold: #D4AF37;
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --text-main: #0a0a0a;
            --accent: #00a676;
        }
        
        .dark-mode {
            --bg-main: #050705;
            --card-bg: #0f130f;
            --text-main: #f0f0f0;
            --accent: #006C48;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #e5e7eb;
            color: var(--text-main);
            transition: background-color 0.3s ease;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            background-color: var(--bg-main);
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-active { color: var(--saudi-green) !important; font-weight: 900; }
        .nav-active i { transform: scale(1.2); }
        
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: inherit;
        }

        .post-card {
            transition: background-color 0.2s;
        }
        
        .post-card:active {
            background-color: rgba(0,0,0,0.02);
        }

        .liked-heart { color: #ef4444 !important; animation: pop 0.3s ease-out; }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="view-login" class="fixed inset-0 z-[999] bg-[#006C48] flex flex-col items-center justify-center p-8 text-center">
        <div class="mb-10 text-white">
            <div class="w-24 h-24 bg-white rounded-[2.5rem] flex items-center justify-center shadow-2xl mx-auto mb-6">
                <i class="fas fa-mountain text-[#006C48] text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black mb-2">منصة طويق</h1>
            <p class="text-white/70 font-medium italic">همة تعانق السماء 🇸🇦</p>
        </div>
        <button onclick="handleLogin()" class="w-full max-w-xs bg-white text-gray-900 font-black py-4 px-6 rounded-2xl flex items-center justify-center gap-4 shadow-xl hover:scale-105 transition-transform active:scale-95">
            <img src="https://www.google.com/favicon.ico" class="w-6 h-6">
            تسجيل الدخول السريع
        </button>
    </div>

    <!-- شاشة إكمال الملف -->
    <div id="view-setup" class="fixed inset-0 z-[998] bg-white flex flex-col p-8 hidden overflow-y-auto text-gray-900">
        <h2 class="text-2xl font-black mb-2">مرحباً بك في طويق</h2>
        <p class="text-gray-400 text-sm mb-8">لنخصص ملفك الشخصي لنبدأ الرحلة</p>
        <div class="space-y-6">
            <div class="flex justify-center mb-6">
                <div class="relative group">
                    <img id="setup-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Tuwaiq" class="w-24 h-24 rounded-3xl bg-gray-100 border-4 border-[#006C48]/20 object-cover">
                    <button onclick="changeAvatar()" class="absolute -bottom-2 -right-2 bg-[#006C48] text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg border-2 border-white">
                        <i class="fas fa-sync-alt text-xs"></i>
                    </button>
                </div>
            </div>
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">الاسم</label>
                <input type="text" id="setup-name" placeholder="مثال: محمد السعد" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48]">
            </div>
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">اسم المستخدم (بالإنجليزي)</label>
                <input type="text" id="setup-username" placeholder="e.g. m_saud" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48]">
            </div>
            <button onclick="completeProfile()" id="btn-save-profile" class="w-full bg-[#006C48] text-white font-black py-4 rounded-2xl shadow-lg mt-4 transition-all active:scale-95">دخول المنصة</button>
        </div>
    </div>

    <!-- تطبيق طويق الرئيسي -->
    <div id="app" class="app-container hidden">
        <header class="shrink-0 bg-inherit/80 backdrop-blur-md border-b border-gray-500/5 px-6 py-4 flex justify-between items-center z-50">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-[#006C48] rounded-xl flex items-center justify-center shadow-md">
                    <i class="fas fa-mountain text-white text-sm"></i>
                </div>
                <h1 class="text-lg font-black tracking-tight">طويق</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="text-lg opacity-40 hover:opacity-100 transition-opacity">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </button>
                <div class="relative">
                    <i class="far fa-bell text-lg opacity-40"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                </div>
            </div>
        </header>

        <main class="no-scrollbar" id="app-main">
            <!-- وجهة الرئيسية -->
            <section id="view-home" class="view-content">
                <!-- شريط البحث -->
                <div class="p-4 bg-inherit sticky top-0 z-40">
                    <div class="relative">
                        <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 opacity-30 text-sm"></i>
                        <input type="text" id="main-search" placeholder="ابحث في همم المجتمع..." class="w-full bg-gray-500/5 border-none rounded-2xl py-3 pr-11 pl-4 text-sm font-medium focus:ring-2 ring-[#006C48] transition-all" oninput="handleSearch(this.value)">
                    </div>
                </div>

                <!-- صندوق النشر -->
                <div class="px-5 pb-4 border-b border-gray-500/5">
                    <div class="flex gap-4">
                        <img id="user-avatar-mini" src="" class="w-11 h-11 rounded-2xl bg-gray-100 shadow-sm object-cover cursor-pointer hover:opacity-80 transition" onclick="switchTab('profile')">
                        <div class="flex-1">
                            <textarea id="post-input" placeholder="ما هي همتك اليوم؟ 🇸🇦" class="w-full bg-transparent border-none resize-none focus:ring-0 text-lg font-medium min-h-[50px] pt-2 no-scrollbar" oninput="autoResize(this)"></textarea>
                            <div class="flex justify-between items-center mt-2 pt-2">
                                <div class="flex gap-3 text-gray-400">
                                    <button class="hover:text-[#006C48] transition-colors"><i class="far fa-image"></i></button>
                                    <button class="hover:text-[#006C48] transition-colors"><i class="far fa-chart-bar"></i></button>
                                    <button class="hover:text-[#006C48] transition-colors"><i class="far fa-calendar-alt"></i></button>
                                </div>
                                <button onclick="publishPost()" class="bg-[#006C48] text-white px-6 py-2 rounded-xl font-black shadow-lg hover:brightness-110 active:scale-95 transition-all text-sm">نشر</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- القصص (Stories) -->
                <div class="flex gap-4 p-4 overflow-x-auto no-scrollbar bg-gray-500/[0.02] border-b border-gray-500/5">
                    <div class="flex flex-col items-center gap-1 min-w-[65px]">
                        <div class="w-14 h-14 rounded-2xl border-2 border-dashed border-[#006C48] flex items-center justify-center cursor-pointer hover:bg-[#006C48]/5 transition">
                            <i class="fas fa-plus text-[#006C48]"></i>
                        </div>
                        <span class="text-[9px] font-bold opacity-40">قصتك</span>
                    </div>
                    <div id="stories-list" class="flex gap-4">
                        <!-- عينات قصص -->
                        <div class="flex flex-col items-center gap-1 min-w-[65px]">
                            <div class="w-14 h-14 rounded-2xl border-2 border-[#D4AF37] p-0.5"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sara" class="w-full h-full rounded-2xl object-cover bg-white"></div>
                            <span class="text-[9px] font-bold opacity-60">سارة</span>
                        </div>
                        <div class="flex flex-col items-center gap-1 min-w-[65px]">
                            <div class="w-14 h-14 rounded-2xl border-2 border-[#006C48] p-0.5"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Faisal" class="w-full h-full rounded-2xl object-cover bg-white"></div>
                            <span class="text-[9px] font-bold opacity-60">فيصل</span>
                        </div>
                    </div>
                </div>

                <!-- التغذية الإخبارية (Feed) -->
                <div id="main-feed" class="divide-y divide-gray-500/5 pb-24">
                    <!-- Shimmer Loading -->
                    <div class="p-6 opacity-20"><div class="h-4 w-1/2 bg-gray-400 rounded mb-4"></div><div class="h-20 bg-gray-400 rounded"></div></div>
                </div>
            </section>

            <!-- وجهة الملف الشخصي -->
            <section id="view-profile" class="view-content hidden pb-24">
                <div class="h-40 bg-gradient-to-br from-[#006C48] to-[#004d33] relative">
                    <button class="absolute top-4 right-4 z-10 w-9 h-9 bg-black/20 text-white rounded-full flex items-center justify-center" onclick="switchTab('home')"><i class="fas fa-arrow-right"></i></button>
                    <img src="https://images.unsplash.com/photo-1548013146-72479768b921?auto=format&fit=crop&w=800" class="w-full h-full object-cover opacity-30">
                </div>
                <div class="px-6 -mt-12 relative">
                    <img id="profile-avatar-large" src="" class="w-24 h-24 rounded-[2rem] bg-white border-4 border-white shadow-2xl object-cover">
                    <div class="mt-4 flex justify-between items-start">
                        <div>
                            <h2 id="profile-name" class="text-2xl font-black">--</h2>
                            <p id="profile-handle" class="text-[#006C48] font-bold text-sm">@--</p>
                        </div>
                        <button onclick="handleLogout()" class="bg-red-500/10 text-red-500 text-[10px] font-black px-3 py-2 rounded-xl hover:bg-red-500 hover:text-white transition-all">خروج</button>
                    </div>
                    <div class="flex gap-8 mt-6 pb-6 border-b border-gray-500/5">
                        <div class="text-center"><span class="block font-black text-lg">1.2K</span><span class="text-[9px] opacity-40 font-black uppercase">متابِع</span></div>
                        <div class="text-center"><span class="block font-black text-lg">850</span><span class="text-[9px] opacity-40 font-black uppercase">يتابع</span></div>
                        <div class="text-center"><span class="block font-black text-lg">34</span><span class="text-[9px] opacity-40 font-black uppercase">همة</span></div>
                    </div>
                </div>
                <div id="user-posts-feed" class="divide-y divide-gray-500/5"></div>
            </section>

            <!-- وجهة الترند -->
            <section id="view-trends" class="view-content hidden p-6 pb-24">
                <h2 class="text-2xl font-black mb-6">المتداول الآن 🇸🇦</h2>
                <div class="space-y-4" id="trends-container"></div>
            </section>
        </main>

        <!-- التنقل السفلي -->
        <nav class="shrink-0 bg-inherit/90 backdrop-blur-xl border-t border-gray-500/10 flex justify-around items-center h-20 z-[100] px-2">
            <button onclick="switchTab('home')" id="nav-home" class="nav-active flex flex-col items-center gap-1.5 flex-1 transition-all">
                <i class="fas fa-house-chimney text-xl"></i>
                <span class="text-[9px] font-black">الرئيسية</span>
            </button>
            <button onclick="switchTab('trends')" id="nav-trends" class="text-gray-400 flex flex-col items-center gap-1.5 flex-1 transition-all">
                <i class="fas fa-hashtag text-xl"></i>
                <span class="text-[9px] font-black">اكتشف</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-gray-400 flex flex-col items-center gap-1.5 flex-1 transition-all">
                <i class="fas fa-user-astronaut text-xl"></i>
                <span class="text-[9px] font-black">ملفي</span>
            </button>
        </nav>
    </div>

    <script>
        // تكوين Supabase (استخدم مفاتيحك الخاصة)
        const SUPABASE_URL = 'https://cuaoopauabnmpmoddvby.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YW9vcGF1YWJubXBtb2RkdmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjgyNDUsImV4cCI6MjA5MzIwNDI0NX0._vyBPMk3oaJqMJaBRY4DaKj2ZjSodKPxZ77kFiZUH9o';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let userSession = null;
        let allPosts = [];
        let likedPosts = JSON.parse(localStorage.getItem('tuwaiq_likes') || '[]');

        window.onload = () => initApp();

        async function initApp() {
            const localUser = localStorage.getItem('tuwaiq_user');
            if (localUser) {
                userSession = JSON.parse(localUser);
                showMainApp();
            } else {
                document.getElementById('view-login').classList.remove('hidden');
            }
        }

        function handleLogin() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-setup').classList.remove('hidden');
        }

        function changeAvatar() {
            const newSeed = Math.random();
            const avatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=${newSeed}`;
            document.getElementById('setup-avatar').src = avatarUrl;
        }

        async function completeProfile() {
            const name = document.getElementById('setup-name').value.trim();
            const username = document.getElementById('setup-username').value.trim().toLowerCase();
            const avatar = document.getElementById('setup-avatar').src;

            if (!name || !username) return showToast("يرجى ملء جميع الحقول");
            if (!/^[a-z0-9_]+$/.test(username)) return showToast("اسم المستخدم غير صالح");

            userSession = { id: Date.now(), full_name: name, username: username, avatar_url: avatar };
            localStorage.setItem('tuwaiq_user', JSON.stringify(userSession));
            showMainApp();
        }

        function showMainApp() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            document.getElementById('user-avatar-mini').src = userSession.avatar_url;
            updateProfileUI();
            
            loadPosts();
            setupRealtime();
            loadTrends();
        }

        async function loadPosts() {
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (!error) {
                allPosts = data;
                renderPosts(allPosts, 'main-feed');
            }
        }

        /**
         * STREAMING_CHUNK:Setting up Realtime Listeners...
         * هذه هي الوظيفة الأهم التي تجعل التطبيق "مباشراً"
         */
        function setupRealtime() {
            _supabase
                .channel('public:posts')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, (payload) => {
                    console.log('تغيير مباشر:', payload);
                    
                    if (payload.eventType === 'INSERT') {
                        allPosts.unshift(payload.new);
                    } 
                    else if (payload.eventType === 'UPDATE') {
                        const index = allPosts.findIndex(p => p.id === payload.new.id);
                        if (index !== -1) allPosts[index] = payload.new;
                    }
                    else if (payload.eventType === 'DELETE') {
                        allPosts = allPosts.filter(p => p.id !== payload.old.id);
                    }

                    // تحديث الواجهة فوراً
                    renderPosts(allPosts, 'main-feed');
                    if (!document.getElementById('view-profile').classList.contains('hidden')) {
                        updateProfilePosts();
                    }
                })
                .subscribe();
        }

        async function publishPost() {
            const input = document.getElementById('post-input');
            const content = input.value.trim();
            if (!content) return;

            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i>';

            const { error } = await _supabase.from('posts').insert([{
                content: content,
                author_name: userSession.full_name,
                author_avatar: userSession.avatar_url,
                username: userSession.username,
                likes: 0
            }]);

            btn.disabled = false;
            btn.innerText = 'نشر';

            if (!error) {
                input.value = "";
                input.style.height = "auto";
                showToast("تم نشر همّتك بنجاح 🇸🇦");
            } else {
                showToast("حدث خطأ في النشر");
            }
        }

        async function handleLike(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            const isLiked = likedPosts.includes(postId);
            const newLikesCount = isLiked ? Math.max(0, (post.likes || 0) - 1) : (post.likes || 0) + 1;

            if (isLiked) {
                likedPosts = likedPosts.filter(id => id !== postId);
            } else {
                likedPosts.push(postId);
            }
            localStorage.setItem('tuwaiq_likes', JSON.stringify(likedPosts));

            // تحديث قاعدة البيانات - سيقوم Realtime بتحديث الواجهة لكل المستخدمين
            await _supabase
                .from('posts')
                .update({ likes: newLikesCount })
                .eq('id', postId);
        }

        function renderPosts(posts, containerId) {
            const container = document.getElementById(containerId);
            if (!posts.length) {
                container.innerHTML = `<div class="p-20 text-center opacity-20 font-black">كن أول من ينشر همته اليوم!</div>`;
                return;
            }

            container.innerHTML = posts.map(post => {
                const isLiked = likedPosts.includes(post.id);
                return `
                    <div class="p-5 post-card bg-inherit border-b border-gray-500/5">
                        <div class="flex gap-3 mb-3">
                            <img src="${post.author_avatar}" class="w-11 h-11 rounded-2xl bg-gray-100 object-cover shadow-sm">
                            <div class="flex-1">
                                <div class="flex items-center justify-between">
                                    <h4 class="font-black text-sm flex items-center gap-1.5">
                                        ${post.author_name}
                                        <i class="fas fa-check-circle text-blue-500 text-[10px]"></i>
                                    </h4>
                                    <span class="text-[9px] opacity-40 font-bold">${formatTime(post.created_at)}</span>
                                </div>
                                <p class="text-[10px] text-[#006C48] font-bold">@${post.username}</p>
                            </div>
                        </div>
                        <p class="text-[15px] mb-4 leading-relaxed font-medium">${post.content}</p>
                        <div class="flex gap-8 text-gray-400">
                            <button onclick="handleLike('${post.id}')" class="flex items-center gap-2 hover:text-red-500 transition-colors ${isLiked ? 'liked-heart' : ''}">
                                <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
                                <span class="text-xs font-black">${post.likes || 0}</span>
                            </button>
                            <button onclick="showToast('سيتم إضافة الردود قريباً')" class="flex items-center gap-2 hover:text-[#006C48]">
                                <i class="far fa-comment"></i>
                                <span class="text-xs font-black">0</span>
                            </button>
                            <button class="mr-auto opacity-30"><i class="fas fa-share-nodes"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function switchTab(tab) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'text-gray-400'));
            const activeBtn = document.getElementById(`nav-${tab}`);
            if (activeBtn) activeBtn.classList.add('nav-active');
            else document.querySelectorAll('nav button').forEach(b => b.classList.add('text-gray-400'));

            if (tab === 'profile') updateProfilePosts();
            document.getElementById('app-main').scrollTop = 0;
        }

        function updateProfileUI() {
            document.getElementById('profile-avatar-large').src = userSession.avatar_url;
            document.getElementById('profile-name').innerText = userSession.full_name;
            document.getElementById('profile-handle').innerText = `@${userSession.username}`;
        }

        function updateProfilePosts() {
            const userPosts = allPosts.filter(p => p.username === userSession.username);
            renderPosts(userPosts, 'user-posts-feed');
        }

        function handleSearch(query) {
            const q = query.toLowerCase().trim();
            if (!q) return renderPosts(allPosts, 'main-feed');
            const filtered = allPosts.filter(p => p.content.toLowerCase().includes(q) || p.author_name.toLowerCase().includes(q));
            renderPosts(filtered, 'main-feed');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        function formatTime(dateStr) {
            const diff = Math.floor((new Date() - new Date(dateStr)) / 1000);
            if (diff < 60) return "الآن";
            if (diff < 3600) return `${Math.floor(diff/60)}د`;
            if (diff < 86400) return `${Math.floor(diff/3600)}س`;
            return new Date(dateStr).toLocaleDateString('ar-SA');
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = "fixed top-10 left-1/2 -translate-x-1/2 bg-[#006C48] text-white px-6 py-3 rounded-2xl text-sm font-black shadow-2xl z-[2000] transition-all";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => t.remove(), 500);
            }, 2500);
        }

        function handleLogout() {
            localStorage.removeItem('tuwaiq_user');
            window.location.reload();
        }

        function loadTrends() {
            const trends = [
                { tag: "#رؤية_السعودية_2030", count: "1.2M", desc: "ترند وطني" },
                { tag: "#نيوم", count: "850K", desc: "مشاريع" },
                { tag: "#طويق_التقنية", count: "500K", desc: "تعليم" },
                { tag: "#يوم_التأسيس", count: "2.1M", desc: "تاريخ" }
            ];
            document.getElementById('trends-container').innerHTML = trends.map(t => `
                <div class="p-4 bg-gray-500/5 rounded-2xl hover:bg-gray-500/10 transition cursor-pointer">
                    <p class="text-[10px] opacity-40 font-bold mb-1">${t.desc}</p>
                    <h3 class="font-black text-lg">${t.tag}</h3>
                    <p class="text-[10px] text-[#006C48] font-bold mt-1">${t.count} همة</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
