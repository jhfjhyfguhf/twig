<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة طويق | Tuwaiq Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --saudi-green: #006C48;
            --saudi-gold: #D4AF37;
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --text-main: #0a0a0a;
        }
        
        .dark-mode {
            --bg-main: #050705;
            --card-bg: #0f130f;
            --text-main: #f0f0f0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #e5e7eb;
            color: var(--text-main);
            transition: all 0.3s ease;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .app-container {
            background-color: var(--bg-main);
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-active { color: var(--saudi-green) !important; font-weight: 900; }
        
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: inherit;
        }

        .scroll-spacer { padding-bottom: 120px; }

        .search-bar-container {
            position: sticky;
            top: 0;
            z-index: 40;
            background: inherit;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .search-input {
            width: 100%;
            background-color: rgba(128, 128, 128, 0.1);
            border: none;
            border-radius: 99px;
            padding: 10px 45px 10px 15px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            background-color: transparent;
            box-shadow: 0 0 0 2px var(--saudi-green);
        }

        .search-icon {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
        }

        .liked { color: #ef4444 !important; }
        .retweeted { color: #10b981 !important; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>

    <div id="view-login" class="fixed inset-0 z-[999] bg-[#006C48] flex flex-col items-center justify-center p-8 text-center transition-all duration-500">
        <div class="mb-10 text-white">
            <div class="w-24 h-24 bg-white rounded-[2.5rem] flex items-center justify-center shadow-2xl mx-auto mb-6">
                <i class="fas fa-mountain text-[#006C48] text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black mb-2">منصة طويق</h1>
            <p class="text-white/70 font-medium italic">همة تعانق السماء 🇸🇦</p>
        </div>
        
        <div class="w-full max-w-xs space-y-4">
            <input type="email" id="login-email" placeholder="بريدك الإلكتروني (Gmail)" 
                class="w-full p-4 rounded-2xl text-center text-gray-900 font-bold outline-none border-2 border-transparent focus:border-[#D4AF37] transition-all shadow-lg">
            
            <button onclick="handleGmailLogin()" id="btn-login-action" class="w-full bg-white text-[#006C48] font-black py-4 px-6 rounded-2xl shadow-xl hover:scale-105 transition-transform active:scale-95 flex items-center justify-center gap-3">
                <i class="fas fa-envelope"></i>
                أرسل رابط الدخول
            </button>
            <p id="login-status" class="text-white/50 text-[10px]">سيصلك رابط تسجيل دخول آمن على بريدك</p>
        </div>
    </div>

    <div id="view-setup" class="fixed inset-0 z-[998] bg-white flex flex-col p-8 hidden overflow-y-auto text-gray-900">
        <h2 class="text-2xl font-black mb-2">إكمال ملفك الشخصي</h2>
        <p class="text-gray-400 text-sm mb-8">لنتمكن من تخصيص تجربتك في طويق</p>
        <div class="space-y-6">
            <div class="flex justify-center mb-6">
                <div class="relative">
                    <img id="setup-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Tuwaiq" class="w-24 h-24 rounded-3xl bg-gray-100 border-4 border-[#006C48]/20 object-cover">
                </div>
            </div>
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">الاسم الكامل</label>
                <input type="text" id="setup-name" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
            </div>
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">اسم المستخدم (English Only)</label>
                <div class="relative">
                    <input type="text" id="setup-username" placeholder="e.g. tuwaiq_hero" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
                </div>
            </div>
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">العمر</label>
                <input type="number" id="setup-age" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
            </div>
            <button onclick="completeProfile()" id="btn-save-profile" class="w-full bg-[#006C48] text-white font-black py-4 rounded-2xl shadow-lg mt-4">حفظ ودخول المنصة</button>
        </div>
    </div>

    <div id="app" class="app-container hidden">
        <header class="shrink-0 bg-inherit/80 backdrop-blur-md border-b border-gray-500/5 px-6 py-4 flex justify-between items-center z-50">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-[#006C48] rounded-xl flex items-center justify-center shadow-md">
                    <i class="fas fa-mountain text-white text-sm"></i>
                </div>
                <h1 class="text-lg font-black tracking-tight">طويق</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="text-lg opacity-40 hover:opacity-100"><i id="theme-icon" class="fas fa-moon"></i></button>
                <button class="text-lg opacity-40 hover:opacity-100"><i class="far fa-bell"></i></button>
            </div>
        </header>

        <main class="no-scrollbar">
            <section id="view-home" class="view-content">
                <div class="search-bar-container">
                    <div class="relative">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="main-search" placeholder="ابحث عن همة..." class="search-input" oninput="handleSearch(this.value)">
                    </div>
                </div>

                <div class="p-4 border-b border-gray-500/5 bg-inherit">
                    <div class="flex gap-4">
                        <img id="user-avatar-mini" src="" class="w-11 h-11 rounded-2xl bg-gray-100 shadow-sm object-cover cursor-pointer" onclick="switchTab('profile')">
                        <div class="flex-1">
                            <textarea id="post-input" placeholder="ما هي همتك اليوم؟ 🇸🇦" class="w-full bg-transparent border-none resize-none focus:ring-0 text-lg font-medium min-h-[60px] pt-2" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                            <div class="flex justify-between items-center mt-2 border-t border-gray-500/5 pt-3">
                                <div class="flex gap-4 text-[#006C48] text-xl">
                                    <label class="cursor-pointer hover:bg-gray-100 p-2 rounded-full transition">
                                        <i class="far fa-image"></i>
                                        <input type="file" id="post-image-upload" class="hidden" accept="image/*">
                                    </label>
                                    <button class="hover:bg-gray-100 p-2 rounded-full transition"><i class="far fa-smile"></i></button>
                                </div>
                                <button onclick="publishPost()" class="bg-[#006C48] text-white px-8 py-2 rounded-full font-black shadow-lg">نشر</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="main-feed" class="divide-y divide-gray-500/5 scroll-spacer"></div>
            </section>

            <section id="view-profile" class="view-content hidden scroll-spacer">
                <div class="h-44 bg-[#006C48] relative">
                    <img src="https://images.unsplash.com/photo-1548013146-72479768b921?auto=format&fit=crop&w=800" class="w-full h-full object-cover opacity-30">
                </div>
                <div class="px-6 -mt-14 relative">
                    <img id="profile-avatar-large" src="" class="w-28 h-28 rounded-[2.5rem] bg-white border-4 border-[#006C48] shadow-2xl object-cover">
                    <div class="mt-4">
                        <h2 id="profile-name" class="text-2xl font-black">--</h2>
                        <p id="profile-handle" class="text-[#D4AF37] font-bold text-sm">@--</p>
                    </div>
                    <div id="profile-actions-box" class="mt-4">
                        <button onclick="handleLogout()" class="w-full bg-red-500/10 text-red-500 font-black py-3 rounded-2xl text-sm">تسجيل الخروج</button>
                    </div>
                </div>
                <div id="user-posts-feed" class="mt-6 divide-y divide-gray-500/5"></div>
            </section>
        </main>

        <nav class="shrink-0 bg-inherit/90 backdrop-blur-xl border-t border-gray-500/10 flex justify-around items-center h-20 z-[100] px-2">
            <button onclick="switchTab('home')" id="nav-home" class="nav-active flex flex-col items-center gap-1.5 flex-1 transition-all">
                <i class="fas fa-house-chimney text-xl"></i>
                <span class="text-[9px] font-black">الرئيسية</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-gray-400 flex flex-col items-center gap-1.5 flex-1 transition-all">
                <i class="fas fa-user-astronaut text-xl"></i>
                <span class="text-[9px] font-black">ملفي</span>
            </button>
        </nav>
    </div>

    <script>
        const SUPABASE_URL = 'https://cuaoopauabnmpmoddvby.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YW9vcGF1YWJubXBtb2RkdmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjgyNDUsImV4cCI6MjA5MzIwNDI0NX0._vyBPMk3oaJqMJaBRY4DaKj2ZjSodKPxZ77kFiZUH9o';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let userSession = null;
        let allPosts = []; 

        window.onload = () => initApp();

        async function initApp() {
            // 1. Check if we have an active session (Handles Magic Link return)
            const { data: { session }, error } = await _supabase.auth.getSession();
            
            if (session) {
                const localUser = localStorage.getItem('tuwaiq_user');
                if (localUser) {
                    userSession = JSON.parse(localUser);
                    showMainApp();
                } else {
                    // Authenticated via email but profile is not setup yet
                    userSession = { 
                        id: session.user.id, 
                        email: session.user.email, 
                        avatar_url: `https://api.dicebear.com/7.x/avataaars/svg?seed=${session.user.id}` 
                    };
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-setup').classList.remove('hidden');
                }
            } else {
                document.getElementById('view-login').classList.remove('hidden');
            }

            _supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    console.log("Welcome! Logged in via email.");
                    // After clicking link, the browser might need a refresh to sync everything
                    if (!userSession) window.location.reload();
                }
            });
        }

        async function handleGmailLogin() {
            const email = document.getElementById('login-email').value.trim();
            const btn = document.getElementById('btn-login-action');
            const statusText = document.getElementById('login-status');

            if (!email || !email.includes('@')) return showToast("يرجى إدخال بريد إلكتروني صحيح 📧");

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> جاري الإرسال...';

            const { error } = await _supabase.auth.signInWithOtp({
                email: email,
                options: {
                    emailRedirectTo: window.location.origin
                }
            });

            if (error) {
                showToast("خطأ: " + error.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-envelope"></i> أرسل رابط الدخول';
            } else {
                showToast("تم إرسال الرابط بنجاح! تفقد بريدك الإلكتروني 📥");
                btn.innerHTML = "تفقد بريدك الآن ✅";
                statusText.innerHTML = "أرسلنا رابطاً خاصاً إلى " + email + ". اضغط عليه لتسجيل الدخول فوراً.";
                statusText.classList.add('text-white', 'opacity-100');
            }
        }

        async function completeProfile() {
            const name = document.getElementById('setup-name').value.trim();
            const username = document.getElementById('setup-username').value.trim().toLowerCase();
            const age = document.getElementById('setup-age').value;

            if (!name || !username || !age) return showToast("يرجى إكمال جميع الحقول");
            if (!/^[a-z0-9_]+$/.test(username)) return showToast("اليوزر يجب أن يكون إنجليزي، حروف صغيرة وأرقام فقط");

            userSession.full_name = name;
            userSession.username = username;
            userSession.age = age;

            localStorage.setItem('tuwaiq_user', JSON.stringify(userSession));
            showMainApp();
            showToast("مرحباً بك في طويق! 🇸🇦");
        }

        function showMainApp() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('user-avatar-mini').src = userSession.avatar_url;
            updateProfileView(userSession);
            loadPosts();
        }

        async function loadPosts() {
            const { data, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
            if (!error) { allPosts = data; renderPosts(data, 'main-feed'); }
        }

        function renderPosts(posts, containerId) {
            const container = document.getElementById(containerId);
            if (!posts || posts.length === 0) {
                container.innerHTML = `<div class="p-20 text-center opacity-30 text-xs font-bold italic">لا توجد همم حالياً..</div>`;
                return;
            }
            container.innerHTML = posts.map(post => `
                <div class="p-5 border-b border-gray-500/5 animate-fade-in">
                    <div class="flex gap-3 mb-3">
                        <img src="${post.author_avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=Tuwaiq'}" class="w-10 h-10 rounded-xl bg-gray-100 object-cover">
                        <div>
                            <h4 class="font-black text-sm">${post.author_name}</h4>
                            <p class="text-[10px] text-[#006C48] font-bold">@${post.username}</p>
                        </div>
                    </div>
                    <p class="text-[14px] leading-relaxed">${post.content}</p>
                </div>
            `).join('');
        }

        async function publishPost() {
            const input = document.getElementById('post-input');
            const content = input.value.trim();
            if (!content) return;
            const { error } = await _supabase.from('posts').insert([{ 
                content: content, author_name: userSession.full_name, author_avatar: userSession.avatar_url, username: userSession.username, likes: 0 
            }]);
            if (!error) { input.value = ""; loadPosts(); showToast("تم النشر بنجاح 🇸🇦"); }
        }

        function switchTab(tab) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById(`nav-${tab}`).classList.add('nav-active');
        }

        function updateProfileView(user) {
            document.getElementById('profile-avatar-large').src = user.avatar_url;
            document.getElementById('profile-name').innerText = user.full_name;
            document.getElementById('profile-handle').innerText = `@${user.username}`;
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            localStorage.removeItem('tuwaiq_user');
            window.location.reload();
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = "fixed top-10 left-1/2 -translate-x-1/2 bg-[#006C48] text-white px-6 py-3 rounded-2xl text-sm font-black shadow-2xl z-[2000] animate-fade-in";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transition = '0.5s'; setTimeout(() => t.remove(), 500); }, 2500);
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        function handleSearch(query) {
            const q = query.toLowerCase().trim();
            if (!q) { renderPosts(allPosts, 'main-feed'); return; }
            const filtered = allPosts.filter(p => p.content.toLowerCase().includes(q) || p.author_name.toLowerCase().includes(q));
            renderPosts(filtered, 'main-feed');
        }
    </script>
</body>
</html>
