<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>طويق | إدارة الحساب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --saudi-green: #006C48;
            --saudi-green-dark: #004d33;
            --saudi-gold: #D4AF37;
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --text-main: #0a0a0a;
            --accent-soft: rgba(0, 108, 72, 0.05);
        }
        
        .dark-mode {
            --bg-main: #050705;
            --card-bg: #121612;
            --text-main: #f0f0f0;
            --accent-soft: rgba(255, 255, 255, 0.03);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
            color: var(--text-main);
            transition: background 0.3s ease;
            margin: 0;
            overflow: hidden;
        }

        .app-container {
            background-color: var(--bg-main);
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-active { color: var(--saudi-green) !important; font-weight: 900; }
        .nav-active i { transform: translateY(-4px); }
        
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .settings-menu {
            position: absolute;
            top: 65px;
            left: 20px;
            width: 240px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            z-index: 100;
            display: none;
            overflow: hidden;
            border: 1px solid rgba(0,108,72,0.1);
            backdrop-filter: blur(15px);
        }
        .settings-menu.show { display: block; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .profile-tab-active {
            color: var(--saudi-green);
            position: relative;
        }
        .profile-tab-active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            right: 25%;
            height: 3px;
            background: var(--saudi-green);
            border-radius: 10px;
        }

        .post-card {
            transition: background 0.2s;
            cursor: pointer;
        }
        .post-card:active { background: var(--accent-soft); }

        #avatar-input { display: none; }

        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
        }
        .dark-mode .glass-effect {
            background: rgba(18, 22, 18, 0.85);
        }

        .input-field {
            width: 100%;
            background: rgba(0,0,0,0.03);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 14px 16px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }
        .dark-mode .input-field { background: rgba(255,255,255,0.05); }
        .input-field:focus {
            border-color: var(--saudi-green);
            background: white;
            box-shadow: 0 4px 12px rgba(0,108,72,0.08);
        }
        .dark-mode .input-field:focus { background: #1a1f1a; }
    </style>
</head>
<body>

    <!-- Login View -->
    <div id="view-login" class="fixed inset-0 z-[999] bg-[#006C48] flex flex-col items-center justify-center p-8 text-center">
        <div class="mb-12 text-white animate-pulse text-center">
            <div class="w-24 h-24 bg-white rounded-[2.5rem] flex items-center justify-center shadow-2xl mx-auto mb-6">
                <i class="fas fa-mountain text-[#006C48] text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black mb-2">منصة طويق</h1>
            <p class="text-white/80 font-medium">همة تعانق السماء 🇸🇦</p>
        </div>
        <button onclick="handleLogin()" class="w-full max-w-xs bg-white text-gray-900 font-black py-4 px-6 rounded-2xl flex items-center justify-center gap-4 shadow-xl hover:brightness-95 transition">
            <img src="https://www.google.com/favicon.ico" class="w-6 h-6" alt="Google">
            دخول سريع للمعاينة
        </button>
    </div>

    <!-- Enhanced Profile Edit Modal -->
    <div id="modal-edit-profile" class="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-[#121612] w-full max-w-md rounded-[2.5rem] p-6 shadow-2xl transition-all border border-white/10 overflow-y-auto max-h-[90vh] no-scrollbar">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black">إعدادات الحساب</h3>
                <button onclick="closeEditModal()" class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-white/5 flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="space-y-5">
                <!-- Avatar Section -->
                <div class="flex flex-col items-center gap-2 mb-2">
                    <div class="relative group" onclick="document.getElementById('avatar-input').click()">
                        <img id="edit-avatar-preview" src="" class="w-24 h-24 rounded-[2rem] object-cover border-4 border-[#006C48] shadow-xl">
                        <div class="absolute inset-0 bg-black/40 rounded-[2rem] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all cursor-pointer">
                            <i class="fas fa-camera text-white"></i>
                        </div>
                        <input type="file" id="avatar-input" accept="image/*" onchange="handleImageUpload(event)">
                    </div>
                    <p class="text-[10px] font-black opacity-40 uppercase tracking-widest">تحديث الصورة</p>
                </div>

                <!-- Name (Required) -->
                <div class="space-y-1.5">
                    <label class="text-[11px] font-black px-1 opacity-50 uppercase tracking-tighter">الاسم الكامل (إلزامي)</label>
                    <input type="text" id="edit-name" placeholder="أدخل اسمك" class="input-field">
                </div>

                <!-- Bio (Optional) -->
                <div class="space-y-1.5">
                    <label class="text-[11px] font-black px-1 opacity-50 uppercase tracking-tighter">النبذة التعريفية (اختياري)</label>
                    <textarea id="edit-bio" placeholder="من أنت؟" class="input-field h-24 resize-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <!-- Location (Optional) -->
                    <div class="space-y-1.5">
                        <label class="text-[11px] font-black px-1 opacity-50 uppercase tracking-tighter">المنطقة (اختياري)</label>
                        <input type="text" id="edit-location" placeholder="مثلاً: الرياض" class="input-field">
                    </div>
                    <!-- Birthday (Optional) -->
                    <div class="space-y-1.5">
                        <label class="text-[11px] font-black px-1 opacity-50 uppercase tracking-tighter">ميلادك (اختياري)</label>
                        <input type="date" id="edit-birthday" class="input-field">
                    </div>
                </div>

                <div class="flex gap-3 pt-4">
                    <button onclick="closeEditModal()" class="flex-1 bg-gray-100 dark:bg-white/5 py-4 rounded-2xl font-black text-sm">إلغاء</button>
                    <button onclick="saveProfileChanges()" class="flex-[2] bg-[#006C48] text-white font-black py-4 rounded-2xl shadow-lg shadow-[#006C48]/20 text-sm">حفظ التغييرات</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app-container hidden">
        <header class="shrink-0 bg-inherit/90 glass-effect px-6 py-4 flex justify-between items-center z-[60] border-b border-gray-500/5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#006C48] rounded-xl flex items-center justify-center shadow-lg transform rotate-3">
                    <i class="fas fa-mountain text-white text-sm"></i>
                </div>
                <h1 class="text-xl font-black tracking-tighter">طويق</h1>
            </div>
            <div class="flex items-center gap-4 relative">
                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-xl bg-gray-500/5 flex items-center justify-center text-lg opacity-80 transition"><i id="theme-icon" class="fas fa-moon"></i></button>
                <button onclick="toggleSettings()" class="w-10 h-10 rounded-xl bg-gray-500/5 flex items-center justify-center text-lg opacity-80 transition"><i class="fas fa-ellipsis-v"></i></button>
                
                <div id="settings-menu" class="settings-menu">
                    <button onclick="openEditModal()" class="w-full text-right px-6 py-4 hover:bg-gray-100 dark:hover:bg-white/5 border-b border-gray-500/5 flex items-center justify-between font-bold">
                        <span>إعدادات الملف</span>
                        <i class="fas fa-user-gear text-xs opacity-40"></i>
                    </button>
                    <button onclick="handleLogout()" class="w-full text-right px-6 py-4 hover:bg-red-50 dark:hover:bg-red-900/10 text-red-500 flex items-center justify-between font-bold text-sm">
                        <span>تسجيل الخروج</span>
                        <i class="fas fa-power-off text-xs opacity-60"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="no-scrollbar">
            <!-- Home Feed -->
            <section id="view-home" class="view-content">
                <div class="p-4">
                    <div class="relative group">
                        <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 opacity-30"></i>
                        <input type="text" placeholder="ماذا يدور في خاطرك؟" class="w-full bg-gray-500/5 rounded-2xl py-4 pr-12 pl-4 text-sm font-bold outline-none border-2 border-transparent focus:border-[#006C48]/20 transition">
                    </div>
                </div>

                <div class="px-5 py-6 border-b border-gray-500/5">
                    <div class="flex gap-4">
                        <img id="user-avatar-mini" src="" class="w-12 h-12 rounded-2xl object-cover border-2 border-white dark:border-white/10" onclick="switchTab('profile')">
                        <div class="flex-1">
                            <textarea id="post-input" placeholder="اكتب همتك اليوم.. 🇸🇦" class="w-full bg-transparent border-none resize-none focus:ring-0 text-lg font-medium pt-2 h-14 overflow-hidden" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                            <div class="flex justify-between items-center mt-3">
                                <div class="flex gap-3">
                                    <button class="text-[#006C48] opacity-40 hover:opacity-100 transition"><i class="far fa-image text-lg"></i></button>
                                    <button class="text-[#006C48] opacity-40 hover:opacity-100 transition"><i class="far fa-smile text-lg"></i></button>
                                </div>
                                <button onclick="publishPost()" class="bg-[#006C48] text-white px-8 py-3 rounded-2xl font-black shadow-lg shadow-[#006C48]/30 hover:scale-105 active:scale-95 transition-all">نشر</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="main-feed" class="divide-y divide-gray-500/5 pb-32"></div>
            </section>

            <!-- Profile View -->
            <section id="view-profile" class="view-content hidden pb-32">
                <div class="h-48 bg-gradient-to-br from-[#006C48] to-[#004d33] relative">
                    <img id="profile-banner" src="https://images.unsplash.com/photo-1548013146-72479768b921?auto=format&fit=crop&w=1200" class="w-full h-full object-cover opacity-40">
                </div>
                
                <div class="px-6 -mt-14 relative z-10">
                    <div class="relative inline-block">
                        <img id="profile-avatar-large" src="" class="w-28 h-28 rounded-[2.5rem] bg-white border-[6px] border-white dark:border-[#121612] shadow-2xl object-cover">
                        <div class="absolute bottom-1 left-1 w-7 h-7 bg-[#D4AF37] rounded-full border-4 border-white dark:border-[#121612] flex items-center justify-center text-[8px] text-white">
                            <i class="fas fa-check"></i>
                        </div>
                    </div>
                    
                    <div class="mt-4">
                        <div class="flex items-center gap-2">
                            <h2 id="profile-name" class="text-2xl font-black tracking-tight">--</h2>
                            <i class="fas fa-circle-check text-[#006C48] text-sm"></i>
                        </div>
                        <p id="profile-handle" class="text-[#006C48] font-black text-sm opacity-60">@--</p>
                        <p id="profile-bio" class="mt-4 text-[15px] font-medium opacity-80 leading-relaxed">--</p>
                        
                        <div class="flex flex-wrap items-center gap-x-5 gap-y-2 mt-4 text-[12px] opacity-50 font-bold">
                            <span id="display-location"><i class="fas fa-map-marker-alt ml-2"></i>--</span>
                            <span id="display-birthday"><i class="fas fa-cake-candles ml-2"></i>--</span>
                            <span><i class="far fa-calendar-alt ml-2"></i>انضم في مايو 2024</span>
                        </div>
                    </div>

                    <div class="flex gap-10 mt-8 py-5 border-y border-gray-500/5">
                        <div class="text-center">
                            <div class="font-black text-lg">1.2K</div>
                            <div class="text-[9px] opacity-40 font-black uppercase tracking-widest">متابِع</div>
                        </div>
                        <div class="text-center">
                            <div class="font-black text-lg">850</div>
                            <div class="text-[9px] opacity-40 font-black uppercase tracking-widest">يتابع</div>
                        </div>
                        <div class="text-center">
                            <div id="stats-posts-count" class="font-black text-lg">0</div>
                            <div class="text-[9px] opacity-40 font-black uppercase tracking-widest">منشور</div>
                        </div>
                    </div>
                </div>

                <div class="flex border-b border-gray-500/5 sticky top-0 bg-inherit/90 glass-effect z-20 mt-4">
                    <button onclick="setProfileTab('my-tweets')" id="tab-my-tweets" class="flex-1 py-4 text-xs font-black transition-all profile-tab-active uppercase tracking-widest">المنشورات</button>
                    <button onclick="setProfileTab('my-media')" id="tab-my-media" class="flex-1 py-4 text-xs font-black transition-all opacity-30 uppercase tracking-widest">الوسائط</button>
                    <button onclick="setProfileTab('my-likes')" id="tab-my-likes" class="flex-1 py-4 text-xs font-black transition-all opacity-30 uppercase tracking-widest">الإعجابات</button>
                </div>
                
                <div id="user-posts-feed" class="divide-y divide-gray-500/5"></div>
            </section>
        </main>

        <nav class="shrink-0 bg-inherit/90 glass-effect border-t border-gray-500/5 flex justify-around items-center h-20 z-[100] px-4">
            <button onclick="switchTab('home')" id="nav-home" class="nav-active flex flex-col items-center gap-1 flex-1">
                <i class="fas fa-house-chimney text-xl"></i>
                <span class="text-[9px] font-black uppercase tracking-widest">الرئيسية</span>
            </button>
            <button class="text-gray-400 flex flex-col items-center gap-1 flex-1 opacity-40">
                <i class="fas fa-magnifying-glass text-xl"></i>
                <span class="text-[9px] font-black uppercase tracking-widest">استكشاف</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-gray-400 flex flex-col items-center gap-1 flex-1">
                <i class="fas fa-user-circle text-xl"></i>
                <span class="text-[9px] font-black uppercase tracking-widest">الملف</span>
            </button>
        </nav>
    </div>

    <script>
        // Supabase - DO NOT EDIT
        const SUPABASE_URL = 'https://cuaoopauabnmpmoddvby.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YW9vcGF1YWJubXBtb2RkdmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjgyNDUsImV4cCI6MjA5MzIwNDI0NX0._vyBPMk3oaJqMJaBRY4DaKj2ZjSodKPxZ77kFiZUH9o';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let userSession = null;
        let allPosts = [];
        let currentTab = 'home';
        let currentProfileTab = 'my-tweets';

        window.onload = () => initApp();

        function initApp() {
            const stored = localStorage.getItem('tuwaiq_user');
            if (stored) {
                userSession = JSON.parse(stored);
                showApp();
            } else {
                document.getElementById('view-login').classList.remove('hidden');
            }
        }

        function handleLogin() {
            const id = Math.random().toString(36).substring(7);
            userSession = {
                id: 'usr_' + id,
                full_name: 'بطل طويق',
                username: 'tuwaiq_' + id.substring(0,3),
                avatar_url: `https://api.dicebear.com/7.x/avataaars/svg?seed=${id}`,
                bio: 'همة تعانق السماء، شغوف بالتكنولوجيا وبناء المستقبل 🇸🇦',
                location: 'الرياض، السعودية',
                birthday: ''
            };
            localStorage.setItem('tuwaiq_user', JSON.stringify(userSession));
            showApp();
        }

        function showApp() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            refreshUI();
            loadPosts();
        }

        function refreshUI() {
            if(!userSession) return;
            document.getElementById('user-avatar-mini').src = userSession.avatar_url;
            document.getElementById('profile-avatar-large').src = userSession.avatar_url;
            document.getElementById('profile-name').innerText = userSession.full_name;
            document.getElementById('profile-handle').innerText = `@${userSession.username}`;
            document.getElementById('profile-bio').innerText = userSession.bio || "لا توجد نبذة تعريفية..";
            
            // Location and Birthday
            document.getElementById('display-location').innerHTML = `<i class="fas fa-map-marker-alt ml-2"></i>${userSession.location || 'غير محدد'}`;
            document.getElementById('display-birthday').innerHTML = `<i class="fas fa-cake-candles ml-2"></i>${userSession.birthday ? formatDate(userSession.birthday) : 'غير محدد'}`;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('ar-SA', { day: 'numeric', month: 'long' });
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('edit-avatar-preview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function openEditModal() {
            document.getElementById('edit-avatar-preview').src = userSession.avatar_url;
            document.getElementById('edit-name').value = userSession.full_name;
            document.getElementById('edit-bio').value = userSession.bio || "";
            document.getElementById('edit-location').value = userSession.location || "";
            document.getElementById('edit-birthday').value = userSession.birthday || "";
            document.getElementById('modal-edit-profile').classList.remove('hidden');
            document.getElementById('settings-menu').classList.remove('show');
        }

        function closeEditModal() {
            document.getElementById('modal-edit-profile').classList.add('hidden');
        }

        async function saveProfileChanges() {
            const name = document.getElementById('edit-name').value.trim();
            if (!name) {
                showToast("الاسم إلزامي للمتابعة");
                return;
            }

            userSession.full_name = name;
            userSession.bio = document.getElementById('edit-bio').value.trim();
            userSession.location = document.getElementById('edit-location').value.trim();
            userSession.birthday = document.getElementById('edit-birthday').value;
            userSession.avatar_url = document.getElementById('edit-avatar-preview').src;

            localStorage.setItem('tuwaiq_user', JSON.stringify(userSession));
            
            refreshUI();
            closeEditModal();
            showToast("تم تحديث إعداداتك بنجاح ✅");
            loadPosts(); 
        }

        async function loadPosts() {
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (!error) {
                allPosts = data;
                renderFeed('main-feed', allPosts);
                if (currentTab === 'profile') refreshProfileFeed();
                updateStats();
            }
        }

        function updateStats() {
            const myPostsCount = allPosts.filter(p => p.username === userSession.username).length;
            document.getElementById('stats-posts-count').innerText = myPostsCount;
        }

        async function publishPost() {
            const input = document.getElementById('post-input');
            const content = input.value.trim();
            if (!content) return;

            const { error } = await _supabase.from('posts').insert([{
                content: content,
                author_name: userSession.full_name,
                author_avatar: userSession.avatar_url,
                username: userSession.username,
                likes: 0
            }]);

            if (!error) {
                input.value = "";
                input.style.height = "56px";
                loadPosts();
                showToast("تم النشر ✨");
            }
        }

        function renderFeed(containerId, posts) {
            const container = document.getElementById(containerId);
            if (!posts.length) {
                container.innerHTML = `<div class="p-20 text-center opacity-20 font-black">لا توجد مشاركات</div>`;
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="p-5 post-card border-b border-gray-500/5">
                    <div class="flex gap-4 mb-3">
                        <img src="${post.author_avatar}" class="w-11 h-11 rounded-2xl object-cover shadow-sm">
                        <div class="flex-1">
                            <div class="flex items-center gap-1.5">
                                <h4 class="font-black text-sm">${post.author_name}</h4>
                                <i class="fas fa-badge-check text-[#006C48] text-[10px]"></i>
                                <span class="text-[10px] opacity-30 font-bold ml-auto">${new Date(post.created_at).toLocaleDateString('ar-SA')}</span>
                            </div>
                            <p class="text-[10px] text-[#006C48] font-black opacity-50">@${post.username}</p>
                        </div>
                    </div>
                    <p class="text-[15px] leading-relaxed mb-4 font-medium opacity-90">${post.content}</p>
                    <div class="flex gap-8 opacity-50">
                        <button onclick="likePost('${post.id}')" class="flex items-center gap-2 hover:text-red-500"><i class="far fa-heart text-xs"></i><span class="text-xs font-black">${post.likes || 0}</span></button>
                        <button class="flex items-center gap-2 hover:text-blue-500"><i class="far fa-comment text-xs"></i><span class="text-xs font-black">0</span></button>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'text-[#006C48]'));
            document.querySelectorAll('nav button').forEach(b => b.classList.add('text-gray-400', 'opacity-40'));
            
            const btn = document.getElementById(`nav-${tab}`);
            btn.classList.add('nav-active');
            btn.classList.remove('text-gray-400', 'opacity-40');
            
            if (tab === 'profile') refreshProfileFeed();
            document.getElementById('settings-menu').classList.remove('show');
            document.querySelector('main').scrollTo(0,0);
        }

        function setProfileTab(tabId) {
            currentProfileTab = tabId;
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('profile-tab-active');
                btn.classList.add('opacity-30');
            });
            const el = document.getElementById(`tab-${tabId}`);
            el.classList.add('profile-tab-active');
            el.classList.remove('opacity-30');
            refreshProfileFeed();
        }

        function refreshProfileFeed() {
            if (currentProfileTab === 'my-tweets') {
                const filtered = allPosts.filter(p => p.username === userSession.username);
                renderFeed('user-posts-feed', filtered);
            } else {
                document.getElementById('user-posts-feed').innerHTML = `<div class="p-20 text-center opacity-30 font-black">قريباً</div>`;
            }
        }

        function toggleSettings() {
            document.getElementById('settings-menu').classList.toggle('show');
        }

        function handleLogout() {
            localStorage.removeItem('tuwaiq_user');
            window.location.reload();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = "fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-2xl text-[12px] font-black shadow-2xl z-[2000] flex items-center gap-3";
            t.innerHTML = `<i class="fas fa-check-circle text-[#006C48]"></i> ${msg}`;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        async function likePost(id) {
            const post = allPosts.find(p => p.id === id);
            await _supabase.from('posts').update({ likes: (post.likes || 0) + 1 }).eq('id', id);
            loadPosts();
        }
    </script>
</body>
</html>
