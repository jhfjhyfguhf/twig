<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>طويق | إدارة الحساب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --saudi-green: #006C48;
            --saudi-gold: #D4AF37;
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --text-main: #0a0a0a;
        }
        
        .dark-mode {
            --bg-main: #050705;
            --card-bg: #0f130f;
            --text-main: #f0f0f0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
            color: var(--text-main);
            transition: background 0.3s ease;
            margin: 0;
            overflow: hidden;
        }

        .app-container {
            background-color: var(--bg-main);
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-active { color: var(--saudi-green) !important; font-weight: 900; transform: scale(1.1); }
        
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .settings-menu {
            position: absolute;
            top: 65px;
            left: 20px;
            width: 220px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            z-index: 100;
            display: none;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.08);
            backdrop-filter: blur(10px);
        }
        .settings-menu.show { display: block; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .profile-tab-active {
            border-bottom: 3px solid var(--saudi-green);
            color: var(--saudi-green);
            opacity: 1 !important;
        }

        /* Custom File Input */
        #avatar-input { display: none; }
    </style>
</head>
<body>

    <!-- Login View -->
    <div id="view-login" class="fixed inset-0 z-[999] bg-[#006C48] flex flex-col items-center justify-center p-8 text-center">
        <div class="mb-12 text-white animate-pulse">
            <div class="w-24 h-24 bg-white rounded-[2.5rem] flex items-center justify-center shadow-2xl mx-auto mb-6">
                <i class="fas fa-mountain text-[#006C48] text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black mb-2">منصة طويق</h1>
            <p class="text-white/80 font-medium">همة تعانق السماء 🇸🇦</p>
        </div>
        <button onclick="handleLogin()" class="w-full max-w-xs bg-white text-gray-900 font-black py-4 px-6 rounded-2xl flex items-center justify-center gap-4 shadow-xl hover:brightness-95 transition">
            <img src="https://www.google.com/favicon.ico" class="w-6 h-6">
            دخول سريع للمعاينة
        </button>
    </div>

    <!-- Profile Edit Modal -->
    <div id="modal-edit-profile" class="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white dark:bg-[#0f130f] w-full max-w-md rounded-t-[3rem] sm:rounded-[3rem] p-8 shadow-2xl transition-all border-t border-white/10">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-black">إعدادات الحساب</h3>
                <button onclick="closeEditModal()" class="w-12 h-12 rounded-2xl bg-gray-100 dark:bg-white/5 flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="space-y-6">
                <div class="flex flex-col items-center gap-3">
                    <div class="relative group" onclick="document.getElementById('avatar-input').click()">
                        <img id="edit-avatar-preview" src="" class="w-32 h-32 rounded-[2.5rem] object-cover border-4 border-[#006C48] shadow-xl">
                        <div class="absolute inset-0 bg-black/40 rounded-[2.5rem] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all cursor-pointer">
                            <i class="fas fa-camera text-white text-2xl"></i>
                        </div>
                        <input type="file" id="avatar-input" accept="image/*" onchange="handleImageUpload(event)">
                    </div>
                    <p class="text-xs font-bold opacity-50">اضغط لتغيير الصورة من الألبوم</p>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-black px-2">الاسم بالكامل</label>
                    <input type="text" id="edit-name" placeholder="اسمك الكريم" class="w-full bg-gray-100 dark:bg-white/5 rounded-2xl p-4 font-bold outline-none border-2 border-transparent focus:border-[#006C48] transition">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-black px-2">نبذة عنك (Bio)</label>
                    <textarea id="edit-bio" placeholder="تحدث عن طموحاتك.." class="w-full bg-gray-100 dark:bg-white/5 rounded-2xl p-4 font-bold outline-none border-2 border-transparent focus:border-[#006C48] transition resize-none h-28"></textarea>
                </div>

                <button onclick="saveProfileChanges()" class="w-full bg-[#006C48] text-white font-black py-4 rounded-2xl shadow-lg hover:shadow-[#006C48]/40 active:scale-95 transition-all mt-4">حفظ البيانات</button>
            </div>
        </div>
    </div>

    <!-- Main App Structure -->
    <div id="app" class="app-container hidden">
        <header class="shrink-0 bg-inherit/90 backdrop-blur-md px-6 py-4 flex justify-between items-center z-[60] border-b border-gray-500/5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#006C48] rounded-xl flex items-center justify-center shadow-lg">
                    <i class="fas fa-mountain text-white text-sm"></i>
                </div>
                <h1 class="text-xl font-black tracking-tighter">طويق</h1>
            </div>
            <div class="flex items-center gap-4 relative">
                <button onclick="toggleDarkMode()" class="text-xl opacity-50 hover:opacity-100 transition"><i id="theme-icon" class="fas fa-moon"></i></button>
                <button onclick="toggleSettings()" class="text-xl opacity-50 hover:opacity-100 transition"><i class="fas fa-sliders"></i></button>
                
                <div id="settings-menu" class="settings-menu">
                    <button onclick="openEditModal()" class="w-full text-right px-6 py-4 hover:bg-gray-100 dark:hover:bg-white/5 border-b border-gray-500/5 flex items-center justify-between font-bold">
                        <span>تعديل الملف</span>
                        <i class="fas fa-user-pen text-xs opacity-40"></i>
                    </button>
                    <button onclick="handleLogout()" class="w-full text-right px-6 py-4 hover:bg-red-50 dark:hover:bg-red-900/10 text-red-500 flex items-center justify-between font-bold">
                        <span>تسجيل الخروج</span>
                        <i class="fas fa-power-off text-xs opacity-60"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="no-scrollbar">
            <!-- Home Feed View -->
            <section id="view-home" class="view-content">
                <div class="p-4">
                    <div class="relative">
                        <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 opacity-30"></i>
                        <input type="text" placeholder="ابحث في طويق.." class="w-full bg-gray-500/5 rounded-2xl py-3 pr-11 pl-4 text-sm font-bold outline-none focus:bg-transparent focus:ring-2 ring-[#006C48]/20 transition">
                    </div>
                </div>

                <div class="px-5 py-4 border-b border-gray-500/5">
                    <div class="flex gap-4">
                        <img id="user-avatar-mini" src="" class="w-12 h-12 rounded-2xl object-cover shadow-sm cursor-pointer" onclick="switchTab('profile')">
                        <div class="flex-1">
                            <textarea id="post-input" placeholder="ما الجديد في همتك؟ 🇸🇦" class="w-full bg-transparent border-none resize-none focus:ring-0 text-lg font-medium pt-2 h-12 overflow-hidden" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                            <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-500/5">
                                <div class="flex gap-4 text-[#006C48] text-xl">
                                    <button class="hover:bg-gray-100 p-2 rounded-xl transition"><i class="far fa-image"></i></button>
                                </div>
                                <button onclick="publishPost()" class="bg-[#006C48] text-white px-8 py-2.5 rounded-2xl font-black shadow-lg hover:scale-105 transition-all">نشر</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="main-feed" class="divide-y divide-gray-500/5 pb-32"></div>
            </section>

            <!-- Profile View -->
            <section id="view-profile" class="view-content hidden pb-32">
                <div class="h-48 bg-[#006C48] relative overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1548013146-72479768b921?auto=format&fit=crop&w=1200" class="w-full h-full object-cover opacity-40">
                </div>
                <div class="px-6 -mt-16 relative">
                    <div class="flex justify-between items-end">
                        <img id="profile-avatar-large" src="" class="w-32 h-32 rounded-[2.8rem] bg-white border-8 border-white dark:border-[#0f130f] shadow-2xl object-cover">
                        <button onclick="openEditModal()" class="mb-2 bg-gray-100 dark:bg-white/5 px-6 py-2.5 rounded-2xl font-black text-sm border border-gray-500/10">تعديل الملف</button>
                    </div>
                    <div class="mt-5">
                        <div class="flex items-center gap-2">
                            <h2 id="profile-name" class="text-2xl font-black">--</h2>
                            <i class="fas fa-shield-check text-[#D4AF37] text-sm"></i>
                        </div>
                        <p id="profile-handle" class="text-[#006C48] font-black text-sm mt-0.5">@--</p>
                        <p id="profile-bio" class="mt-4 text-sm font-medium opacity-80 leading-relaxed max-w-sm">--</p>
                    </div>
                    <div class="flex gap-8 mt-6 pb-6">
                        <div class="flex gap-1.5 items-center"><span class="font-black text-lg">1.2K</span><span class="text-[10px] opacity-40 font-black">متابِع</span></div>
                        <div class="flex gap-1.5 items-center"><span class="font-black text-lg">850</span><span class="text-[10px] opacity-40 font-black">يتابعني</span></div>
                    </div>
                </div>
                <div class="flex border-b border-gray-500/5 sticky top-0 bg-inherit z-20">
                    <button onclick="setProfileTab('my-tweets')" id="tab-my-tweets" class="flex-1 py-5 text-xs font-black transition-all profile-tab-active">تغريداتي</button>
                    <button onclick="setProfileTab('my-likes')" id="tab-my-likes" class="flex-1 py-5 text-xs font-black transition-all opacity-30">الإعجابات</button>
                </div>
                <div id="user-posts-feed" class="divide-y divide-gray-500/5"></div>
            </section>
        </main>

        <nav class="shrink-0 bg-inherit border-t border-gray-500/5 flex justify-around items-center h-20 z-[100]">
            <button onclick="switchTab('home')" id="nav-home" class="nav-active flex flex-col items-center gap-1 flex-1">
                <i class="fas fa-home-alt text-xl"></i>
                <span class="text-[9px] font-black">الرئيسية</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-gray-400 flex flex-col items-center gap-1 flex-1">
                <i class="fas fa-user text-xl"></i>
                <span class="text-[9px] font-black">حسابي</span>
            </button>
        </nav>
    </div>

    <script>
        // Supabase Config - DO NOT EDIT
        const SUPABASE_URL = 'https://cuaoopauabnmpmoddvby.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YW9vcGF1YWJubXBtb2RkdmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjgyNDUsImV4cCI6MjA5MzIwNDI0NX0._vyBPMk3oaJqMJaBRY4DaKj2ZjSodKPxZ77kFiZUH9o';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let userSession = null;
        let allPosts = [];
        let currentTab = 'home';
        let currentProfileTab = 'my-tweets';

        window.onload = () => initApp();

        function initApp() {
            const stored = localStorage.getItem('tuwaiq_user');
            if (stored) {
                userSession = JSON.parse(stored);
                showApp();
            } else {
                document.getElementById('view-login').classList.remove('hidden');
            }
        }

        function handleLogin() {
            const id = Math.random().toString(36).substring(7);
            userSession = {
                id: 'usr_' + id,
                full_name: 'بطل طويق',
                username: 'tuwaiq_' + id.substring(0,3),
                avatar_url: `https://api.dicebear.com/7.x/avataaars/svg?seed=${id}`,
                bio: 'همة تعانق السماء 🇸🇦'
            };
            localStorage.setItem('tuwaiq_user', JSON.stringify(userSession));
            showApp();
        }

        function showApp() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            refreshUI();
            loadPosts();
        }

        function refreshUI() {
            if(!userSession) return;
            document.getElementById('user-avatar-mini').src = userSession.avatar_url;
            document.getElementById('profile-avatar-large').src = userSession.avatar_url;
            document.getElementById('profile-name').innerText = userSession.full_name;
            document.getElementById('profile-handle').innerText = `@${userSession.username}`;
            document.getElementById('profile-bio').innerText = userSession.bio || "لا توجد نبذة..";
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('edit-avatar-preview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function openEditModal() {
            document.getElementById('edit-avatar-preview').src = userSession.avatar_url;
            document.getElementById('edit-name').value = userSession.full_name;
            document.getElementById('edit-bio').value = userSession.bio || "";
            document.getElementById('modal-edit-profile').classList.remove('hidden');
            document.getElementById('settings-menu').classList.remove('show');
        }

        function closeEditModal() {
            document.getElementById('modal-edit-profile').classList.add('hidden');
        }

        async function saveProfileChanges() {
            const newName = document.getElementById('edit-name').value.trim();
            const newBio = document.getElementById('edit-bio').value.trim();
            const newAvatar = document.getElementById('edit-avatar-preview').src;

            if (!newName) {
                showToast("يرجى إدخال الاسم");
                return;
            }

            // تحديث بيانات الجلسة الحالية
            userSession.full_name = newName;
            userSession.bio = newBio;
            userSession.avatar_url = newAvatar;

            // الحفظ في LocalStorage
            localStorage.setItem('tuwaiq_user', JSON.stringify(userSession));
            
            // تحديث الواجهة
            refreshUI();
            closeEditModal();
            showToast("تم الحفظ بنجاح ✅");
            
            // إعادة تحميل المنشورات لتحديث الصور والأسماء فيها
            loadPosts();
        }

        async function loadPosts() {
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (!error) {
                allPosts = data;
                renderFeed('main-feed', allPosts);
                if (currentTab === 'profile') refreshProfileFeed();
            }
        }

        async function publishPost() {
            const input = document.getElementById('post-input');
            const content = input.value.trim();
            if (!content) return;

            const { error } = await _supabase.from('posts').insert([{
                content: content,
                author_name: userSession.full_name,
                author_avatar: userSession.avatar_url,
                username: userSession.username,
                likes: 0
            }]);

            if (!error) {
                input.value = "";
                loadPosts();
                showToast("تم النشر 🚀");
            }
        }

        function renderFeed(containerId, posts) {
            const container = document.getElementById(containerId);
            if (!posts.length) {
                container.innerHTML = `<div class="p-20 text-center opacity-30 font-bold">لا يوجد محتوى</div>`;
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="p-5">
                    <div class="flex gap-4 mb-3">
                        <img src="${post.author_avatar}" class="w-12 h-12 rounded-2xl object-cover">
                        <div class="flex-1">
                            <h4 class="font-black text-sm">${post.author_name}</h4>
                            <p class="text-[11px] text-[#006C48] font-bold">@${post.username}</p>
                        </div>
                    </div>
                    <p class="text-[15px] mb-4">${post.content}</p>
                    <div class="flex gap-10 opacity-40 text-xs font-black">
                        <button onclick="likePost('${post.id}')"><i class="far fa-heart ml-1"></i>${post.likes || 0}</button>
                        <button><i class="far fa-comment ml-1"></i>0</button>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById(`nav-${tab}`).classList.add('nav-active');
            if (tab === 'profile') refreshProfileFeed();
            document.getElementById('settings-menu').classList.remove('show');
        }

        function setProfileTab(tabId) {
            currentProfileTab = tabId;
            document.querySelectorAll('[id^="tab-"]').forEach(btn => btn.classList.remove('profile-tab-active'));
            document.querySelectorAll('[id^="tab-"]').forEach(btn => btn.classList.add('opacity-30'));
            const el = document.getElementById(`tab-${tabId}`);
            el.classList.add('profile-tab-active');
            el.classList.remove('opacity-30');
            refreshProfileFeed();
        }

        function refreshProfileFeed() {
            const filtered = allPosts.filter(p => p.username === userSession.username);
            renderFeed('user-posts-feed', filtered);
        }

        function toggleSettings() {
            document.getElementById('settings-menu').classList.toggle('show');
        }

        function handleLogout() {
            localStorage.removeItem('tuwaiq_user');
            window.location.reload();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = "fixed bottom-24 left-1/2 -translate-x-1/2 bg-[#006C48] text-white px-8 py-3 rounded-2xl text-sm font-black shadow-2xl z-[2000]";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        async function likePost(id) {
            const post = allPosts.find(p => p.id === id);
            await _supabase.from('posts').update({ likes: (post.likes || 0) + 1 }).eq('id', id);
            loadPosts();
        }
    </script>
</body>
</html>
