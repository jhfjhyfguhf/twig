<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة طويق | Tuwaiq Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --saudi-green: #006C48;
            --saudi-gold: #D4AF37;
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --text-main: #0a0a0a;
        }
        
        .dark-mode {
            --bg-main: #050705;
            --card-bg: #0f130f;
            --text-main: #f0f0f0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #e5e7eb;
            color: var(--text-main);
            transition: all 0.3s ease;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .app-container {
            background-color: var(--bg-main);
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-active { color: var(--saudi-green) !important; font-weight: 900; }
        
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: inherit;
        }

        .scroll-spacer { padding-bottom: 120px; }

        .search-bar-container {
            position: sticky;
            top: 0;
            z-index: 40;
            background: inherit;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .search-input {
            width: 100%;
            background-color: rgba(128, 128, 128, 0.1);
            border: none;
            border-radius: 99px;
            padding: 10px 45px 10px 15px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            background-color: transparent;
            box-shadow: 0 0 0 2px var(--saudi-green);
        }

        .search-icon {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <!-- واجهة تسجيل الدخول المحدثة لدعم Gmail و SMTP -->
    <div id="view-login" class="fixed inset-0 z-[999] bg-[#006C48] flex flex-col items-center justify-center p-8 text-center">
        <div class="mb-10 text-white">
            <div class="w-24 h-24 bg-white rounded-[2.5rem] flex items-center justify-center shadow-2xl mx-auto mb-6">
                <i class="fas fa-mountain text-[#006C48] text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black mb-2">منصة طويق</h1>
            <p class="text-white/70 font-medium italic">سجل دخولك عبر Gmail 🇸🇦</p>
        </div>
        
        <div class="w-full max-w-xs space-y-4">
            <input type="email" id="login-email" placeholder="أدخل بريدك الإلكتروني" 
                class="w-full p-4 rounded-2xl text-center text-gray-900 font-bold outline-none border-2 border-transparent focus:border-[#D4AF37] transition-all shadow-lg">
            
            <button onclick="handleGmailLogin()" id="btn-login-action" class="w-full bg-white text-[#006C48] font-black py-4 px-6 rounded-2xl shadow-xl hover:scale-105 transition-transform active:scale-95 flex items-center justify-center gap-3">
                <i class="fas fa-envelope"></i>
                أرسل رابط الدخول
            </button>
            <p id="status-msg" class="text-white/50 text-[10px]">ستصلك رسالة تحتوي على رابط الدخول الفوري</p>
        </div>
    </div>

    <!-- واجهة إكمال الملف الشخصي -->
    <div id="view-setup" class="fixed inset-0 z-[998] bg-white flex flex-col p-8 hidden overflow-y-auto text-gray-900">
        <h2 class="text-2xl font-black mb-2">إكمال ملفك الشخصي</h2>
        <p class="text-gray-400 text-sm mb-8">أهلاً بك في طويق، لنكمل بياناتك لمرة واحدة</p>
        <div class="space-y-6">
            <div class="flex justify-center mb-6">
                <div class="relative">
                    <img id="setup-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Tuwaiq" class="w-24 h-24 rounded-3xl bg-gray-100 border-4 border-[#006C48]/20 object-cover">
                </div>
            </div>
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">الاسم الكامل</label>
                <input type="text" id="setup-name" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
            </div>
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">اسم المستخدم (English Only)</label>
                <input type="text" id="setup-username" placeholder="مثال: saudi_hero" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
            </div>
            <div>
                <label class="text-xs font-black opacity-40 block mb-2 mr-1">العمر</label>
                <input type="number" id="setup-age" class="w-full bg-gray-100 border-none rounded-2xl p-4 font-bold focus:ring-2 ring-[#006C48] text-gray-900">
            </div>
            <button onclick="completeProfile()" class="w-full bg-[#006C48] text-white font-black py-4 rounded-2xl shadow-lg mt-4">حفظ والانطلاق 🚀</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app" class="app-container hidden">
        <header class="shrink-0 bg-inherit/80 backdrop-blur-md border-b border-gray-500/5 px-6 py-4 flex justify-between items-center z-50">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-[#006C48] rounded-xl flex items-center justify-center shadow-md">
                    <i class="fas fa-mountain text-white text-sm"></i>
                </div>
                <h1 class="text-lg font-black tracking-tight">طويق</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="text-lg opacity-40 hover:opacity-100"><i id="theme-icon" class="fas fa-moon"></i></button>
                <button class="text-lg opacity-40 hover:opacity-100"><i class="far fa-bell"></i></button>
            </div>
        </header>

        <main class="no-scrollbar">
            <section id="view-home" class="view-content">
                <div class="search-bar-container">
                    <div class="relative">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="main-search" placeholder="ابحث عن همة..." class="search-input" oninput="handleSearch(this.value)">
                    </div>
                </div>

                <div class="p-4 border-b border-gray-500/5">
                    <div class="flex gap-4">
                        <img id="user-avatar-mini" src="" class="w-11 h-11 rounded-2xl bg-gray-100 object-cover">
                        <div class="flex-1">
                            <textarea id="post-input" placeholder="ما هي همتك اليوم؟ 🇸🇦" class="w-full bg-transparent border-none resize-none focus:ring-0 text-lg font-medium min-h-[60px] pt-2"></textarea>
                            <div class="flex justify-end mt-2">
                                <button onclick="publishPost()" class="bg-[#006C48] text-white px-8 py-2 rounded-full font-black shadow-lg">نشر</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="main-feed" class="divide-y divide-gray-500/5 scroll-spacer"></div>
            </section>

            <section id="view-profile" class="view-content hidden scroll-spacer p-6 text-center">
                <img id="profile-avatar-large" src="" class="w-24 h-24 rounded-full mx-auto border-4 border-[#006C48] mb-4">
                <h2 id="profile-name" class="text-xl font-black"></h2>
                <p id="profile-handle" class="text-[#D4AF37] mb-6"></p>
                <button onclick="handleLogout()" class="bg-red-500 text-white px-6 py-2 rounded-xl font-bold">تسجيل الخروج</button>
            </section>
        </main>

        <nav class="shrink-0 bg-inherit border-t border-gray-500/10 flex justify-around items-center h-20 z-[100]">
            <button onclick="switchTab('home')" class="flex flex-col items-center gap-1 flex-1 nav-active" id="nav-home">
                <i class="fas fa-house-chimney text-xl"></i>
                <span class="text-[9px] font-black">الرئيسية</span>
            </button>
            <button onclick="switchTab('profile')" class="flex flex-col items-center gap-1 flex-1 text-gray-400" id="nav-profile">
                <i class="fas fa-user-astronaut text-xl"></i>
                <span class="text-[9px] font-black">ملفي</span>
            </button>
        </nav>
    </div>

    <script>
        const SUPABASE_URL = 'https://cuaoopauabnmpmoddvby.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YW9vcGF1YWJubXBtb2RkdmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjgyNDUsImV4cCI6MjA5MzIwNDI0NX0._vyBPMk3oaJqMJaBRY4DaKj2ZjSodKPxZ77kFiZUH9o';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let userSession = null;
        let allPosts = [];

        window.onload = () => initApp();

        async function initApp() {
            // التحقق من وجود جلسة
            const { data: { session } } = await _supabase.auth.getSession();
            
            if (session) {
                const localUser = localStorage.getItem('tuwaiq_user');
                if (localUser) {
                    userSession = JSON.parse(localUser);
                    showMainApp();
                } else {
                    // إذا مسجل دخول لكن لم يكمل الملف
                    userSession = { 
                        id: session.user.id, 
                        email: session.user.email, 
                        avatar_url: `https://api.dicebear.com/7.x/avataaars/svg?seed=${session.user.id}` 
                    };
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-setup').classList.remove('hidden');
                }
            } else {
                document.getElementById('view-login').classList.remove('hidden');
            }

            // مراقبة تغيير الحالة عند العودة من الإيميل
            _supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    if (!localStorage.getItem('tuwaiq_user')) {
                        // إعادة تحميل لضمان الانتقال لواجهة الإكمال
                        location.reload(); 
                    }
                }
            });
        }

        async function handleGmailLogin() {
            const email = document.getElementById('login-email').value.trim();
            const btn = document.getElementById('btn-login-action');

            if (!email || !email.includes('@')) return showToast("يرجى إدخال بريد إلكتروني صحيح 📧");

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> جاري الإرسال...';

            const { error } = await _supabase.auth.signInWithOtp({
                email: email,
                options: {
                    emailRedirectTo: window.location.origin
                }
            });

            if (error) {
                if (error.message.includes("rate limit")) {
                    showToast("❌ وصلت للحد الأقصى! يرجى الانتظار ساعة أو تفعيل SMTP.");
                } else {
                    showToast("خطأ: " + error.message);
                }
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-envelope"></i> أرسل رابط الدخول';
            } else {
                showToast("تم إرسال رابط الدخول لبريدك بنجاح! 📥");
                btn.innerHTML = "تفقد بريدك الآن ✅";
                document.getElementById('status-msg').innerText = "تم الإرسال لـ " + email;
            }
        }

        async function completeProfile() {
            const name = document.getElementById('setup-name').value.trim();
            const username = document.getElementById('setup-username').value.trim().toLowerCase();
            const age = document.getElementById('setup-age').value;

            if (!name || !username || !age) return showToast("يرجى إكمال جميع الحقول");

            userSession.full_name = name;
            userSession.username = username;
            userSession.age = age;

            // حفظ البيانات محلياً (يمكنك حفظها في جدول 'profiles' في سوبابيس أيضاً لاحقاً)
            localStorage.setItem('tuwaiq_user', JSON.stringify(userSession));
            showMainApp();
            showToast("مرحباً بك في مجتمع طويق! 🇸🇦");
        }

        function showMainApp() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('user-avatar-mini').src = userSession.avatar_url;
            document.getElementById('profile-avatar-large').src = userSession.avatar_url;
            document.getElementById('profile-name').innerText = userSession.full_name;
            document.getElementById('profile-handle').innerText = `@${userSession.username}`;
            loadPosts();
        }

        async function loadPosts() {
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (!error) {
                allPosts = data;
                renderPosts(data);
            }
        }

        function renderPosts(posts) {
            const container = document.getElementById('main-feed');
            if (!posts.length) {
                container.innerHTML = `<div class="p-20 text-center opacity-30 text-xs font-bold">لا توجد منشورات حالياً..</div>`;
                return;
            }
            container.innerHTML = posts.map(post => `
                <div class="p-5 border-b border-gray-500/5">
                    <div class="flex gap-3 mb-4">
                        <img src="${post.author_avatar}" class="w-10 h-10 rounded-xl object-cover">
                        <div>
                            <h4 class="font-black text-sm">${post.author_name}</h4>
                            <p class="text-[10px] text-[#006C48] font-bold">@${post.username}</p>
                        </div>
                    </div>
                    <p class="text-[15px] font-medium">${post.content}</p>
                </div>
            `).join('');
        }

        async function publishPost() {
            const input = document.getElementById('post-input');
            const content = input.value.trim();
            if (!content) return;

            const { error } = await _supabase.from('posts').insert([{
                content,
                author_name: userSession.full_name,
                author_avatar: userSession.avatar_url,
                username: userSession.username
            }]);

            if (!error) {
                input.value = "";
                loadPosts();
                showToast("تم النشر بنجاح 🇸🇦");
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'text-[#006C48]'));
            document.getElementById(`nav-${tab}`).classList.add('nav-active');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            localStorage.removeItem('tuwaiq_user');
            location.reload();
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = "fixed top-10 left-1/2 -translate-x-1/2 bg-[#006C48] text-white px-6 py-3 rounded-2xl text-sm font-black shadow-2xl z-[2000]";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function handleSearch(val) {
            const filtered = allPosts.filter(p => p.content.includes(val) || p.author_name.includes(val));
            renderPosts(filtered);
        }
    </script>
</body>
</html>
