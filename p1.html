<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة طويق | Tuwaiq Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --saudi-green: #006C48;
            --saudi-gold: #D4AF37;
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --text-main: #0a0a0a;
        }
        
        .dark-mode {
            --bg-main: #050705;
            --card-bg: #0f130f;
            --text-main: #f0f0f0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #e5e7eb;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .app-container {
            background-color: var(--bg-main);
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-active { color: var(--saudi-green) !important; font-weight: 900; }
        
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: inherit;
        }

        .view-content { padding-bottom: 100px; }

        .post-card {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 15px;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--saudi-green);
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 15px;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn-primary:active { transform: scale(0.98); }

        .input-field {
            background: rgba(128,128,128,0.1);
            border: none;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            margin-bottom: 10px;
            outline: none;
        }

        .live-badge {
            background: #ef4444;
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Auth View -->
    <div id="view-auth" class="fixed inset-0 z-[1000] bg-[#006C48] flex flex-col items-center justify-center p-8 text-center">
        <div class="mb-8 text-white">
            <i class="fas fa-mountain text-6xl mb-4"></i>
            <h1 class="text-3xl font-black">منصة طويق</h1>
            <p class="opacity-80">همة تعانق السماء 🇸🇦</p>
        </div>

        <div class="w-full max-w-xs space-y-3 bg-white p-6 rounded-[2rem] shadow-2xl text-right">
            <h2 id="auth-title" class="text-xl font-black text-gray-800 mb-4 text-center">تسجيل الدخول</h2>
            
            <div id="register-fields" class="hidden">
                <input type="text" id="auth-name" placeholder="الاسم الكامل" class="input-field text-gray-900">
            </div>
            
            <input type="text" id="auth-username" placeholder="اسم المستخدم" class="input-field text-gray-900">
            <input type="password" id="auth-password" placeholder="كلمة المرور" class="input-field text-gray-900">
            
            <button onclick="handleAuth()" id="auth-btn" class="btn-primary mt-4">دخول</button>
            
            <p class="text-xs text-gray-500 text-center mt-4 cursor-pointer" onclick="toggleAuthMode()">
                <span id="auth-switch-text">ليس لديك حساب؟ سجل الآن</span>
            </p>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app-container hidden">
        <header class="shrink-0 bg-white/80 backdrop-blur-md border-b px-6 py-4 flex justify-between items-center z-50">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-[#006C48] rounded-lg flex items-center justify-center">
                    <i class="fas fa-mountain text-white text-xs"></i>
                </div>
                <h1 class="text-lg font-black">طويق</h1>
            </div>
            <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                <i id="theme-icon" class="fas fa-moon text-gray-600"></i>
            </button>
        </header>

        <main id="main-scroll" class="no-scrollbar">
            <!-- الرئيسية / المحادثات -->
            <section id="view-home" class="view-content">
                <div class="p-4 bg-white border-b sticky top-0 z-10">
                    <div class="flex gap-3">
                        <img id="my-avatar-mini" src="" class="w-10 h-10 rounded-full bg-gray-200">
                        <div class="flex-1">
                            <textarea id="post-text" placeholder="ما هي همتك اليوم؟" class="w-full border-none focus:ring-0 resize-none h-12 text-sm pt-2" maxlength="280"></textarea>
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-[10px] text-gray-400">استخدم #هاشتاق لرفع الترند</span>
                                <button onclick="createPost()" class="bg-[#006C48] text-white px-5 py-1.5 rounded-full text-xs font-bold">نشر</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="feed-container"></div>
            </section>

            <!-- البثوث -->
            <section id="view-live" class="view-content hidden p-4">
                <h2 class="text-xl font-black mb-4">البثوث المباشرة</h2>
                <div id="live-list" class="grid grid-cols-1 gap-4">
                    <!-- بثوث وهمية للعرض -->
                    <div class="relative h-48 rounded-2xl overflow-hidden bg-gray-300">
                        <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=400" class="w-full h-full object-cover">
                        <div class="absolute top-3 left-3 live-badge">مباشر</div>
                        <div class="absolute bottom-0 inset-x-0 p-3 bg-gradient-to-t from-black text-white">
                            <p class="text-sm font-bold">نقاش تقني حول رؤية 2030</p>
                            <p class="text-[10px] opacity-70">سارة الشمري • 1.2K مشاهد</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- الترند -->
            <section id="view-trends" class="view-content hidden p-6">
                <h2 class="text-xl font-black mb-6">الأكثر تداولاً 🇸🇦</h2>
                <div id="trends-list" class="space-y-4"></div>
            </section>

            <!-- الملف الشخصي (Tiktok Style) -->
            <section id="view-profile" class="view-content hidden">
                <div class="flex flex-col items-center pt-8 pb-4">
                    <div class="relative">
                        <img id="p-avatar" src="" class="w-24 h-24 rounded-full border-4 border-white shadow-xl bg-gray-200 object-cover">
                        <button class="absolute bottom-0 right-0 bg-[#006C48] text-white w-7 h-7 rounded-full border-2 border-white text-[10px]"><i class="fas fa-plus"></i></button>
                    </div>
                    <h3 id="p-name" class="mt-4 text-xl font-black">--</h3>
                    <p id="p-username" class="text-gray-400 text-sm font-bold">@--</p>
                    
                    <div class="flex gap-8 mt-6">
                        <div class="text-center"><p class="font-black">1.2K</p><p class="text-[10px] text-gray-400">متابعة</p></div>
                        <div class="text-center"><p class="font-black">850</p><p class="text-[10px] text-gray-400">متابعين</p></div>
                        <div class="text-center"><p class="font-black">5.4K</p><p class="text-[10px] text-gray-400">تسجيلات إعجاب</p></div>
                    </div>

                    <div class="flex gap-2 mt-6 w-full px-10">
                        <button class="flex-1 bg-gray-100 py-2 rounded-md font-bold text-sm">تعديل الملف</button>
                        <button onclick="logout()" class="w-12 bg-red-50 text-red-500 py-2 rounded-md"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>

                <div class="border-t mt-4">
                    <div class="flex border-b">
                        <button class="flex-1 py-3 border-b-2 border-black font-black text-sm"><i class="fas fa-th-large mr-2"></i> هممي</button>
                        <button class="flex-1 py-3 text-gray-400 text-sm"><i class="fas fa-heart mr-2"></i> المعجب بها</button>
                    </div>
                    <div id="profile-posts" class="divide-y"></div>
                </div>
            </section>
        </main>

        <!-- Navigation -->
        <nav class="shrink-0 bg-white border-t flex justify-around items-center h-20 z-[100]">
            <button onclick="switchTab('home')" id="nav-home" class="nav-active flex flex-col items-center gap-1">
                <i class="fas fa-home text-xl"></i>
                <span class="text-[9px]">الرئيسية</span>
            </button>
            <button onclick="switchTab('live')" id="nav-live" class="text-gray-400 flex flex-col items-center gap-1">
                <i class="fas fa-video text-xl"></i>
                <span class="text-[9px]">البثوث</span>
            </button>
            <button onclick="switchTab('trends')" id="nav-trends" class="text-gray-400 flex flex-col items-center gap-1">
                <i class="fas fa-hashtag text-xl"></i>
                <span class="text-[9px]">الترند</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-gray-400 flex flex-col items-center gap-1">
                <i class="fas fa-user text-xl"></i>
                <span class="text-[9px]">ملفي</span>
            </button>
        </nav>
    </div>

    <script>
        // Config
        const SUPABASE_URL = 'https://cuaoopauabnmpmoddvby.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YW9vcGF1YWJubXBtb2RkdmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjgyNDUsImV4cCI6MjA5MzIwNDI0NX0._vyBPMk3oaJqMJaBRY4DaKj2ZjSodKPxZ77kFiZUH9o';
        const { createClient } = supabase;
        const _db = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let isRegister = false;
        let allPosts = [];

        window.onload = () => {
            const saved = localStorage.getItem('tuwaiq_logged_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                startApp();
            }
        };

        // --- AUTH LOGIC ---
        function toggleAuthMode() {
            isRegister = !isRegister;
            document.getElementById('register-fields').classList.toggle('hidden');
            document.getElementById('auth-title').innerText = isRegister ? "إنشاء حساب جديد" : "تسجيل الدخول";
            document.getElementById('auth-btn').innerText = isRegister ? "تسجيل" : "دخول";
            document.getElementById('auth-switch-text').innerText = isRegister ? "لديك حساب؟ سجل دخول" : "ليس لديك حساب؟ سجل الآن";
        }

        async function handleAuth() {
            const user = document.getElementById('auth-username').value.trim().toLowerCase();
            const pass = document.getElementById('auth-password').value;
            const name = document.getElementById('auth-name').value;

            if (!user || !pass) return showToast("يرجى ملء البيانات");

            if (isRegister) {
                // Check if username exists
                const { data: existing } = await _db.from('tuwaiq_users').select('*').eq('username', user).single();
                if (existing) return showToast("اسم المستخدم محجوز");

                const newUser = {
                    username: user,
                    password: pass,
                    full_name: name || user,
                    avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${user}`
                };

                const { error } = await _db.from('tuwaiq_users').insert([newUser]);
                if (error) return showToast("خطأ في التسجيل");
                
                currentUser = newUser;
                loginSuccess();
            } else {
                const { data, error } = await _db.from('tuwaiq_users').select('*').eq('username', user).eq('password', pass).single();
                if (!data) return showToast("بيانات الدخول غير صحيحة");
                currentUser = data;
                loginSuccess();
            }
        }

        function loginSuccess() {
            localStorage.setItem('tuwaiq_logged_user', JSON.stringify(currentUser));
            startApp();
        }

        function startApp() {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('my-avatar-mini').src = currentUser.avatar;
            document.getElementById('p-avatar').src = currentUser.avatar;
            document.getElementById('p-name').innerText = currentUser.full_name;
            document.getElementById('p-username').innerText = `@${currentUser.username}`;
            
            loadPosts();
            // Subscribe to real-time changes
            _db.channel('public:posts').on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, payload => {
                loadPosts();
            }).subscribe();
        }

        // --- CORE LOGIC ---
        async function createPost() {
            const text = document.getElementById('post-text').value.trim();
            if (!text) return;

            const { error } = await _db.from('posts').insert([{
                content: text,
                author_name: currentUser.full_name,
                username: currentUser.username,
                author_avatar: currentUser.avatar,
                likes: 0
            }]);

            if (!error) {
                document.getElementById('post-text').value = "";
                showToast("تم النشر بنجاح");
            }
        }

        async function loadPosts() {
            const { data, error } = await _db.from('posts').select('*').order('created_at', { ascending: false });
            if (data) {
                allPosts = data;
                renderFeed(data, 'feed-container');
                renderTrends(data);
                renderMyPosts(data);
            }
        }

        function renderFeed(posts, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = posts.map(post => `
                <div class="post-card bg-white">
                    <div class="flex gap-3">
                        <img src="${post.author_avatar}" class="w-10 h-10 rounded-full bg-gray-100">
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <h4 class="text-sm font-black">${post.author_name}</h4>
                                <span class="text-[10px] text-gray-400">${formatDate(post.created_at)}</span>
                            </div>
                            <p class="text-[11px] text-[#006C48] font-bold">@${post.username}</p>
                            <p class="mt-2 text-sm leading-relaxed">${highlightHashtags(post.content)}</p>
                            <div class="flex gap-6 mt-4 text-gray-400">
                                <button class="text-xs hover:text-red-500"><i class="far fa-heart mr-1"></i> ${post.likes || 0}</button>
                                <button class="text-xs hover:text-[#006C48]"><i class="far fa-comment mr-1"></i> 0</button>
                                <button class="text-xs hover:text-blue-500"><i class="fas fa-retweet"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderMyPosts(posts) {
            const myPosts = posts.filter(p => p.username === currentUser.username);
            const container = document.getElementById('profile-posts');
            if (myPosts.length === 0) {
                container.innerHTML = `<div class="p-10 text-center text-gray-400 text-xs">لم تنشر أي همم بعد</div>`;
                return;
            }
            renderFeed(myPosts, 'profile-posts');
        }

        function renderTrends(posts) {
            const hashtags = {};
            posts.forEach(p => {
                const found = p.content.match(/#[\w\u0621-\u064A]+/g);
                if (found) {
                    found.forEach(h => {
                        hashtags[h] = (hashtags[h] || 0) + 1;
                    });
                }
            });

            // تحويلها لمصفوفة وفرزها
            const sorted = Object.entries(hashtags)
                .map(([tag, count]) => ({ tag, count }))
                .sort((a, b) => b.count - a.count);

            const container = document.getElementById('trends-list');
            container.innerHTML = sorted.map((t, index) => `
                <div class="flex justify-between items-center p-4 bg-white rounded-xl shadow-sm border-r-4 border-[#006C48]">
                    <div>
                        <p class="text-[10px] text-gray-400 font-bold">${index + 1} • متداول الآن</p>
                        <h3 class="font-black text-lg">${t.tag}</h3>
                        <p class="text-[10px] text-gray-500">${t.count} مشاركة</p>
                    </div>
                    <div class="text-[#006C48] font-black">${t.count > 100 ? '<i class="fas fa-fire"></i>' : ''}</div>
                </div>
            `).join('');
        }

        // --- UI HELPERS ---
        function switchTab(tab) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'text-gray-400'));
            
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('nav-active');
            
            // Add text-gray-400 to others
            document.querySelectorAll('nav button:not(.nav-active)').forEach(b => b.classList.add('text-gray-400'));
            
            document.getElementById('main-scroll').scrollTop = 0;
        }

        function highlightHashtags(text) {
            return text.replace(/#[\w\u0621-\u064A]+/g, match => `<span class="text-blue-500 font-bold">${match}</span>`);
        }

        function formatDate(date) {
            const d = new Date(date);
            return d.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
        }

        function showToast(msg) {
            const div = document.createElement('div');
            div.className = "fixed bottom-24 left-1/2 -translate-x-1/2 bg-black/80 text-white px-6 py-2 rounded-full text-xs z-[2000]";
            div.innerText = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2000);
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-icon').className = isDark ? 'fas fa-sun text-yellow-400' : 'fas fa-moon text-gray-600';
        }

        function logout() {
            localStorage.removeItem('tuwaiq_logged_user');
            window.location.reload();
        }
    </script>
</body>
</html>
