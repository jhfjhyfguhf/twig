<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة طويق | Tuwaiq Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --saudi-green: #006C48;
            --saudi-gold: #D4AF37;
            --bg-main: #f8faf8;
            --card-bg: #ffffff;
            --text-main: #0a0a0a;
        }
        
        .dark-mode {
            --bg-main: #050705;
            --card-bg: #0f130f;
            --text-main: #f0f0f0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #e5e7eb;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .app-container {
            background-color: var(--bg-main);
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-active { color: var(--saudi-green) !important; font-weight: 900; }
        
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: inherit;
        }

        .view-content { padding-bottom: 100px; }

        .post-card {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 15px;
            background: var(--card-bg);
        }

        .btn-primary {
            background-color: var(--saudi-green);
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 15px;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        .input-field {
            background: rgba(128,128,128,0.1);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            margin-bottom: 10px;
            outline: none;
            transition: all 0.2s;
        }
        
        .input-field:focus {
            border-color: var(--saudi-green);
            background: white;
        }

        .live-badge {
            background: #ef4444;
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #loading-screen {
            background: var(--saudi-green);
            z-index: 2000;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading-screen" class="fixed inset-0 flex items-center justify-center text-white">
        <div class="text-center">
            <i class="fas fa-mountain text-5xl animate-bounce mb-4"></i>
            <p class="font-bold tracking-widest">جاري التحميل...</p>
        </div>
    </div>

    <!-- Auth View -->
    <div id="view-auth" class="fixed inset-0 z-[1000] bg-[#006C48] flex flex-col items-center justify-center p-8 text-center hidden">
        <div class="mb-8 text-white">
            <i class="fas fa-mountain text-6xl mb-4"></i>
            <h1 class="text-3xl font-black">منصة طويق</h1>
            <p class="opacity-80">همة تعانق السماء 🇸🇦</p>
        </div>

        <div class="w-full max-w-xs space-y-3 bg-white p-6 rounded-[2rem] shadow-2xl text-right">
            <h2 id="auth-title" class="text-xl font-black text-gray-800 mb-4 text-center">تسجيل الدخول</h2>
            
            <div id="register-fields" class="hidden">
                <input type="text" id="auth-name" placeholder="الاسم الكامل" class="input-field text-gray-900">
            </div>
            
            <input type="text" id="auth-username" placeholder="اسم المستخدم (بالإنجليزي)" class="input-field text-gray-900">
            <input type="password" id="auth-password" placeholder="كلمة المرور" class="input-field text-gray-900">
            
            <button onclick="handleAuth()" id="auth-btn" class="btn-primary mt-4 flex justify-center items-center gap-2">
                <span id="btn-text">دخول</span>
                <i id="btn-loader" class="fas fa-circle-notch fa-spin hidden"></i>
            </button>
            
            <p class="text-xs text-gray-500 text-center mt-4 cursor-pointer" onclick="toggleAuthMode()">
                <span id="auth-switch-text">ليس لديك حساب؟ سجل الآن</span>
            </p>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app-container hidden">
        <header class="shrink-0 bg-white/80 backdrop-blur-md border-b px-6 py-4 flex justify-between items-center z-50">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-[#006C48] rounded-lg flex items-center justify-center">
                    <i class="fas fa-mountain text-white text-xs"></i>
                </div>
                <h1 class="text-lg font-black">طويق</h1>
            </div>
            <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                <i id="theme-icon" class="fas fa-moon text-gray-600"></i>
            </button>
        </header>

        <main id="main-scroll" class="no-scrollbar">
            <section id="view-home" class="view-content">
                <div class="p-4 bg-white border-b sticky top-0 z-10">
                    <div class="flex gap-3">
                        <img id="my-avatar-mini" src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" class="w-10 h-10 rounded-full bg-gray-200 object-cover">
                        <div class="flex-1">
                            <textarea id="post-text" placeholder="ما هي همتك اليوم؟" class="w-full border-none focus:ring-0 resize-none h-12 text-sm pt-2 bg-transparent outline-none" maxlength="280"></textarea>
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-[10px] text-gray-400">استخدم #هاشتاق لرفع الترند</span>
                                <button onclick="createPost()" class="bg-[#006C48] text-white px-5 py-1.5 rounded-full text-xs font-bold">نشر</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="feed-container"></div>
            </section>

            <section id="view-live" class="view-content hidden p-4">
                <h2 class="text-xl font-black mb-4">البثوث المباشرة</h2>
                <div id="live-list" class="grid grid-cols-1 gap-4">
                    <div class="relative h-48 rounded-2xl overflow-hidden bg-gray-300">
                        <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=400" class="w-full h-full object-cover">
                        <div class="absolute top-3 left-3 live-badge">مباشر</div>
                        <div class="absolute bottom-0 inset-x-0 p-3 bg-gradient-to-t from-black text-white">
                            <p class="text-sm font-bold">نقاش تقني حول رؤية 2030</p>
                            <p class="text-[10px] opacity-70">سارة الشمري • 1.2K مشاهد</p>
                        </div>
                    </div>
                </div>
            </section>

            <section id="view-trends" class="view-content hidden p-6">
                <h2 class="text-xl font-black mb-6">الأكثر تداولاً 🇸🇦</h2>
                <div id="trends-list" class="space-y-4"></div>
            </section>

            <section id="view-profile" class="view-content hidden">
                <div class="flex flex-col items-center pt-8 pb-4">
                    <div class="relative">
                        <img id="p-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" class="w-24 h-24 rounded-full border-4 border-white shadow-xl bg-gray-200 object-cover">
                        <button class="absolute bottom-0 right-0 bg-[#006C48] text-white w-7 h-7 rounded-full border-2 border-white text-[10px]"><i class="fas fa-camera"></i></button>
                    </div>
                    <h3 id="p-name" class="mt-4 text-xl font-black">--</h3>
                    <p id="p-username" class="text-gray-400 text-sm font-bold">@--</p>
                    
                    <div class="flex gap-8 mt-6">
                        <div class="text-center"><p class="font-black">1.2K</p><p class="text-[10px] text-gray-400">متابعة</p></div>
                        <div class="text-center"><p class="font-black">850</p><p class="text-[10px] text-gray-400">متابعين</p></div>
                        <div class="text-center"><p class="font-black">5.4K</p><p class="text-[10px] text-gray-400">إعجاب</p></div>
                    </div>

                    <div class="flex gap-2 mt-6 w-full px-10">
                        <button class="flex-1 bg-gray-100 py-2 rounded-md font-bold text-sm">تعديل الملف</button>
                        <button onclick="logout()" class="w-12 bg-red-50 text-red-500 py-2 rounded-md"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>

                <div class="border-t mt-4">
                    <div class="flex border-b">
                        <button class="flex-1 py-3 border-b-2 border-black font-black text-sm"><i class="fas fa-th-large mr-2"></i> هممي</button>
                        <button class="flex-1 py-3 text-gray-400 text-sm"><i class="fas fa-heart mr-2"></i> المعجب بها</button>
                    </div>
                    <div id="profile-posts" class="divide-y"></div>
                </div>
            </section>
        </main>

        <nav class="shrink-0 bg-white border-t flex justify-around items-center h-20 z-[100]">
            <button onclick="switchTab('home')" id="nav-home" class="nav-active flex flex-col items-center gap-1">
                <i class="fas fa-home text-xl"></i>
                <span class="text-[9px]">الرئيسية</span>
            </button>
            <button onclick="switchTab('live')" id="nav-live" class="text-gray-400 flex flex-col items-center gap-1">
                <i class="fas fa-video text-xl"></i>
                <span class="text-[9px]">البثوث</span>
            </button>
            <button onclick="switchTab('trends')" id="nav-trends" class="text-gray-400 flex flex-col items-center gap-1">
                <i class="fas fa-hashtag text-xl"></i>
                <span class="text-[9px]">الترند</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-gray-400 flex flex-col items-center gap-1">
                <i class="fas fa-user text-xl"></i>
                <span class="text-[9px]">ملفي</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, onSnapshot, addDoc, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // إعدادات افتراضية لمنع التعليق عند التشغيل المحلي
        const defaultAppId = 'tuwaiq-platform-local';
        const dummyConfig = { apiKey: "fake-key", authDomain: "local", projectId: "local" };
        
        const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : dummyConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : defaultAppId;

        // التحقق من وجود إعدادات حقيقية
        const isLocal = config.apiKey === "fake-key";

        let app, auth, db;
        
        if (!isLocal) {
            app = initializeApp(config);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        let userProfile = null;
        let isRegister = false;

        const init = async () => {
            if (isLocal) {
                // إذا كان التشغيل محلياً بدون إعدادات Firebase، نظهر شاشة الدخول مباشرة
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('view-auth').classList.remove('hidden');
                return;
            }

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid);
                        const profileSnap = await getDoc(profileRef);
                        
                        if (profileSnap.exists()) {
                            userProfile = profileSnap.data();
                            showApp();
                        } else {
                            document.getElementById('loading-screen').classList.add('hidden');
                            document.getElementById('view-auth').classList.remove('hidden');
                        }
                    }
                });
            } catch (e) {
                console.error("Firebase Init Error:", e);
                // منع التعليق في حال فشل الاتصال
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('view-auth').classList.remove('hidden');
            }
        };

        window.toggleAuthMode = () => {
            isRegister = !isRegister;
            document.getElementById('register-fields').classList.toggle('hidden');
            document.getElementById('auth-title').innerText = isRegister ? "إنشاء حساب جديد" : "تسجيل الدخول";
            document.getElementById('auth-btn').querySelector('#btn-text').innerText = isRegister ? "تسجيل" : "دخول";
            document.getElementById('auth-switch-text').innerText = isRegister ? "لديك حساب؟ سجل دخول" : "ليس لديك حساب؟ سجل الآن";
        };

        window.handleAuth = async () => {
            const username = document.getElementById('auth-username').value.trim().toLowerCase();
            const password = document.getElementById('auth-password').value;
            const fullName = document.getElementById('auth-name').value.trim();
            const btn = document.getElementById('auth-btn');
            const loader = document.getElementById('btn-loader');

            if (!username || !password || (isRegister && !fullName)) {
                return showToast("يرجى إكمال البيانات");
            }

            if (isLocal) {
                // محاكاة دخول محلي بدون قاعدة بيانات
                userProfile = { username, full_name: fullName || username, avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}` };
                showApp();
                return;
            }

            btn.disabled = true;
            loader.classList.remove('hidden');

            try {
                if (isRegister) {
                    const profileData = {
                        uid: auth.currentUser.uid,
                        username: username,
                        password: password,
                        full_name: fullName,
                        avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`,
                        createdAt: serverTimestamp()
                    };
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', auth.currentUser.uid), profileData);
                    userProfile = profileData;
                    showApp();
                } else {
                    const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', auth.currentUser.uid);
                    const profileSnap = await getDoc(profileRef);
                    if (profileSnap.exists() && profileSnap.data().username === username && profileSnap.data().password === password) {
                        userProfile = profileSnap.data();
                        showApp();
                    } else {
                        showToast("بيانات الدخول غير صحيحة");
                    }
                }
            } catch (e) {
                showToast("حدث خطأ في الاتصال");
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        };

        const showApp = () => {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            document.getElementById('my-avatar-mini').src = userProfile.avatar;
            document.getElementById('p-avatar').src = userProfile.avatar;
            document.getElementById('p-name').innerText = userProfile.full_name;
            document.getElementById('p-username').innerText = `@${userProfile.username}`;
            
            if (!isLocal) listenToPosts();
        };

        const listenToPosts = () => {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                const posts = [];
                snapshot.forEach(doc => posts.push({id: doc.id, ...doc.data()}));
                renderFeed(posts);
                renderTrends(posts);
                renderMyPosts(posts);
            }, (err) => console.error(err));
        };

        window.createPost = async () => {
            const text = document.getElementById('post-text').value.trim();
            if (!text) return;

            if (isLocal) {
                showToast("خاصية النشر تتطلب اتصال Firebase حقيقي");
                return;
            }

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), {
                    content: text,
                    author_name: userProfile.full_name,
                    username: userProfile.username,
                    author_avatar: userProfile.avatar,
                    uid: auth.currentUser.uid,
                    likes: 0,
                    createdAt: serverTimestamp()
                });
                document.getElementById('post-text').value = "";
                showToast("تم نشر همّتك!");
            } catch (e) {
                showToast("فشل النشر");
            }
        };

        const renderFeed = (posts) => {
            const container = document.getElementById('feed-container');
            container.innerHTML = posts.map(post => `
                <div class="post-card">
                    <div class="flex gap-3">
                        <img src="${post.author_avatar}" class="w-10 h-10 rounded-full bg-gray-100">
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <h4 class="text-sm font-black">${post.author_name}</h4>
                                <span class="text-[10px] text-gray-400">الآن</span>
                            </div>
                            <p class="text-[11px] text-[#006C48] font-bold">@${post.username}</p>
                            <p class="mt-2 text-sm leading-relaxed">${highlightHashtags(post.content)}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        const renderTrends = (posts) => {
            const hashtags = {};
            posts.forEach(p => {
                const found = p.content.match(/#[\w\u0621-\u064A]+/g);
                if (found) found.forEach(h => hashtags[h] = (hashtags[h] || 0) + 1);
            });
            const sorted = Object.entries(hashtags).sort((a, b) => b[1] - a[1]);
            document.getElementById('trends-list').innerHTML = sorted.map(([tag, count], i) => `
                <div class="flex justify-between items-center p-4 bg-white rounded-xl shadow-sm border-r-4 border-[#006C48]">
                    <div>
                        <p class="text-[10px] text-gray-400 font-bold">${i + 1} • متداول الآن</p>
                        <h3 class="font-black text-lg">${tag}</h3>
                        <p class="text-[10px] text-gray-500">${count} مشاركة</p>
                    </div>
                </div>
            `).join('');
        };

        const renderMyPosts = (posts) => {
            const myPosts = posts.filter(p => p.uid === (auth?.currentUser?.uid || 'local'));
            const container = document.getElementById('profile-posts');
            container.innerHTML = myPosts.length === 0 ? '<div class="p-10 text-center text-gray-400 text-xs">لا يوجد منشورات</div>' : 
            myPosts.map(post => `<div class="post-card p-4"><p class="text-sm">${highlightHashtags(post.content)}</p></div>`).join('');
        };

        const highlightHashtags = (text) => text.replace(/#[\w\u0621-\u064A]+/g, match => `<span class="text-blue-500 font-bold">${match}</span>`);
        
        window.switchTab = (tab) => {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'text-gray-400'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('nav-active');
            document.getElementById('main-scroll').scrollTop = 0;
        };

        window.toggleDarkMode = () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-icon').className = isDark ? 'fas fa-sun text-yellow-400' : 'fas fa-moon text-gray-600';
        };

        window.logout = () => {
            if (auth) auth.signOut();
            window.location.reload();
        };

        function showToast(msg) {
            const div = document.createElement('div');
            div.className = "fixed bottom-24 left-1/2 -translate-x-1/2 bg-black/80 text-white px-6 py-2 rounded-full text-xs z-[2000] backdrop-blur-md";
            div.innerText = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2500);
        }

        init();
    </script>
</body>
</html>
